<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DNA Central</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: painéis de vidro fosco sobre um fundo (aurora ou foto), capa com foto no topo do Início, menu lateral no computador e pílula embaixo no celular */
:root {
  --bg: #0B080D;
  --aurora: radial-gradient(900px 620px at 8% -5%, rgba(222, 119, 200, .38), transparent 62%), radial-gradient(820px 640px at 100% 18%, rgba(120, 110, 240, .32), transparent 60%), radial-gradient(1000px 700px at 45% 115%, rgba(248, 184, 98, .20), transparent 60%), #0B080D;
  --veil: linear-gradient(180deg, rgba(8, 5, 10, .50), rgba(8, 5, 10, .78));
  --surface: rgba(28, 19, 31, .52);
  --surface-2: rgba(255, 255, 255, .065);
  --surface-3: rgba(255, 255, 255, .13);
  --modal-bg: rgba(30, 20, 33, .9);
  --glass-line: rgba(255, 255, 255, .12);
  --glass-hi: rgba(255, 255, 255, .10);
  --depth: 0 18px 44px rgba(0, 0, 0, .30);
  --ink: #FAF2F8;
  --muted: #BCAABB;
  --line: rgba(255, 255, 255, .10);
  --pink: #F2A5DD;
  --pink-2: #DE77C8;
  --lav: #C3B2FA;
  --peri: #A7B3F8;
  --yellow: #F4E07A;
  --orange: #F8B862;
  --mint: #8FE3BC;
  --on-color: #1A1119;
  --on-color-soft: rgba(26, 17, 25, .66);
  --nav-bg: rgba(12, 8, 14, .62);
  --nav-fg: #FAF2F8;
  --nav-on-bg: #FFFFFF;
  --nav-on-fg: #170F17;
  --danger: #FF7A85;
  --ok: #7EE0A8;
  --overlay: rgba(6, 3, 8, .6);
  --shadow: 0 24px 60px rgba(0, 0, 0, .55);
  --f: Outfit, "Avenir Next", "Segoe UI", Arial, sans-serif;
  --f-d: Sora, Outfit, "Segoe UI", Arial, sans-serif;
  --r-lg: 30px;
  --r: 24px;
  --r-sm: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F1E8F2;
    --aurora: radial-gradient(900px 620px at 8% -5%, rgba(242, 165, 221, .55), transparent 62%), radial-gradient(820px 640px at 100% 18%, rgba(167, 179, 248, .5), transparent 60%), radial-gradient(1000px 700px at 45% 115%, rgba(248, 210, 140, .45), transparent 60%), #F1E8F2;
    --veil: linear-gradient(180deg, rgba(250, 244, 250, .45), rgba(250, 244, 250, .7));
    --surface: rgba(255, 255, 255, .58); --surface-2: rgba(26, 17, 25, .045); --surface-3: rgba(26, 17, 25, .085); --modal-bg: rgba(255, 255, 255, .92);
    --glass-line: rgba(255, 255, 255, .7); --glass-hi: rgba(255, 255, 255, .85); --depth: 0 14px 36px rgba(90, 30, 90, .10);
    --ink: #1A1119; --muted: #6E5C6B; --line: rgba(26, 17, 25, .08);
    --nav-bg: rgba(26, 17, 25, .82); --nav-fg: #FAF2F8; --nav-on-bg: #FFFFFF; --nav-on-fg: #1A1119;
    --danger: #D23A55; --ok: #1E8F57; --overlay: rgba(40, 15, 35, .35); --shadow: 0 24px 60px rgba(80, 20, 70, .18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F1E8F2;
  --aurora: radial-gradient(900px 620px at 8% -5%, rgba(242, 165, 221, .55), transparent 62%), radial-gradient(820px 640px at 100% 18%, rgba(167, 179, 248, .5), transparent 60%), radial-gradient(1000px 700px at 45% 115%, rgba(248, 210, 140, .45), transparent 60%), #F1E8F2;
  --veil: linear-gradient(180deg, rgba(250, 244, 250, .45), rgba(250, 244, 250, .7));
  --surface: rgba(255, 255, 255, .58); --surface-2: rgba(26, 17, 25, .045); --surface-3: rgba(26, 17, 25, .085); --modal-bg: rgba(255, 255, 255, .92);
  --glass-line: rgba(255, 255, 255, .7); --glass-hi: rgba(255, 255, 255, .85); --depth: 0 14px 36px rgba(90, 30, 90, .10);
  --ink: #1A1119; --muted: #6E5C6B; --line: rgba(26, 17, 25, .08);
  --nav-bg: rgba(26, 17, 25, .82); --nav-fg: #FAF2F8; --nav-on-bg: #FFFFFF; --nav-on-fg: #1A1119;
  --danger: #D23A55; --ok: #1E8F57; --overlay: rgba(40, 15, 35, .35); --shadow: 0 24px 60px rgba(80, 20, 70, .18);
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nav-bg); backdrop-filter: blur(20px); }
.backdrop { position: fixed; inset: 0; z-index: -1; background: var(--aurora); }
.backdrop.photo { background-size: cover; background-position: center; }
.backdrop.photo::after { content: ""; position: absolute; inset: 0; background: var(--veil); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
svg { display: block; }

/* Vidro fosco: transparência + desfoque do que está atrás + brilho na borda */
.panel, .today-card, .goal, .col, .cal, .gantt-wrap, .kcard, .gcard, .notice, .brand, .day, .nav, .timerbar, .modal, .empty, .list > .row, .ic-btn, .pill-btn:not(.solid), .chip, .filters select, .filters input, .team .add, .mswitch {
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  backdrop-filter: blur(22px) saturate(150%);
}
.panel, .today-card, .goal, .col, .cal, .gantt-wrap, .kcard, .gcard, .notice, .day, .timerbar, .empty, .list > .row {
  border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--depth);
}

.app { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(180px + env(safe-area-inset-bottom, 0px)); }

/* Cabeçalho */
.top { display: flex; align-items: center; gap: 10px; }
.me-pic { width: 50px; height: 50px; border-radius: 50%; flex: none; background: linear-gradient(140deg, var(--pink), var(--lav)); color: var(--on-color); display: grid; place-items: center; font: 700 18px var(--f-d); border: 0; box-shadow: 0 8px 22px rgba(222, 119, 200, .35); }
.hello { flex: 1; min-width: 0; }
.hello small { display: block; color: var(--muted); font-size: 13px; }
.hello b { display: block; font: 600 19px/1.15 var(--f-d); letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand { font: italic 700 15px var(--f-d); letter-spacing: -.02em; padding: 7px 13px; border-radius: 999px; background: var(--surface); border: 1px solid var(--glass-line); }
.ic-btn { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--surface); display: grid; place-items: center; flex: none; color: var(--ink); }
.ic-btn:hover { background: var(--surface-3); }
.ic-btn svg { width: 20px; height: 20px; }
.ic-btn.light { background: rgba(255, 255, 255, .8); color: #1A1119; border-color: rgba(255, 255, 255, .6); }
.ic-btn.light:hover { background: #FFFFFF; }
.ic-btn.sm { width: 36px; height: 36px; }
.ic-btn.sm svg { width: 16px; height: 16px; }
.badge { position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; border-radius: 10px; background: var(--pink); color: #1A1119; font: 700 11px/19px var(--f); text-align: center; padding: 0 5px; }

.team { display: flex; gap: 10px; align-items: center; margin: 18px 0; overflow-x: auto; padding: 3px 2px; }
.team .add { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--surface); display: grid; place-items: center; flex: none; color: var(--ink); }
.team .add svg { width: 22px; height: 22px; }
.mate { position: relative; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: none; }
.mate .ring { width: 52px; height: 52px; border-radius: 50%; padding: 2.5px; background: linear-gradient(140deg, var(--pink), var(--lav), var(--yellow)); }
.mate .ring span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font: 700 17px var(--f-d); border: 2.5px solid var(--bg); color: var(--on-color); }
.mate small { font-size: 12px; color: var(--muted); max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mate.me small { color: var(--ink); font-weight: 600; }
.mate .on-air { position: absolute; top: 1px; right: 1px; width: 14px; height: 14px; border-radius: 50%; background: var(--ok); border: 2.5px solid var(--bg); }
.team-hint { font-size: 13px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.on i { background: var(--ok); }
.sync.local i { background: var(--orange); }

.notice { margin-bottom: 18px; padding: 12px 16px; border-radius: var(--r-sm); background: var(--surface); border-style: dashed !important; border-color: var(--orange) !important; color: var(--muted); font-size: 14px; }
.notice b { color: var(--ink); }

/* Capa com foto no topo do Início */
.cover { position: relative; overflow: hidden; isolation: isolate; border-radius: var(--r-lg); height: clamp(220px, 34vw, 380px); margin-bottom: 18px; background: #2A1B2C center / cover no-repeat; border: 1px solid rgba(255, 255, 255, .25); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 24px 50px rgba(0, 0, 0, .35); color: #FFFFFF; }
.cover > svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.cover .cv-info { position: absolute; right: 14px; bottom: 14px; max-width: calc(100% - 28px); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; padding: 8px 12px; border-radius: 16px; background: rgba(12, 6, 14, .28); border: 1px solid rgba(255, 255, 255, .22); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.cover .cv-info b { font: 600 14px var(--f-d); letter-spacing: -.02em; }
.cover .cv-info span { font-size: 11.5px; color: rgba(255, 255, 255, .82); }
.cover .cv-btn { position: absolute; right: 14px; top: 14px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: #FFFFFF; background: rgba(12, 6, 14, .28); border: 1px solid rgba(255, 255, 255, .4); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.cover .cv-btn:hover { background: rgba(255, 255, 255, .25); }
.cover .cv-btn svg { width: 16px; height: 16px; }
.msg .bub { cursor: pointer; }
.msg .bub:hover { filter: brightness(1.08); }
.msg em { font-style: normal; opacity: .7; }
.notice .pill-btn { margin-left: 8px; }

/* Títulos */
.h-xl { font: 600 clamp(32px, 5.4vw, 50px)/1 var(--f-d); letter-spacing: -.045em; margin: 0; text-wrap: balance; }
.h-sec { font: 600 21px/1.2 var(--f-d); letter-spacing: -.03em; margin: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 14px; }
.view-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.view-head p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
.view-head .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill-btn { border: 1px solid var(--glass-line); background: var(--surface); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.pill-btn:hover { background: var(--surface-3); }
.pill-btn.solid { background: var(--ink); color: var(--bg); border-color: transparent; }
.pill-btn.solid:hover { opacity: .88; background: var(--ink); }
.pill-btn.small { padding: 7px 14px; font-size: 13px; }
.pill-btn.big { width: 100%; padding: 15px; font-size: 15px; }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; min-width: 0; }
.mswitch { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--glass-line); border-radius: 999px; padding: 4px; }
.mswitch b { font: 600 14px var(--f-d); padding: 0 10px; min-width: 120px; text-align: center; }
.mswitch b::first-letter { text-transform: uppercase; }
.mswitch .ic-btn { width: 34px; height: 34px; border: 0; background: var(--surface-2); }

/* Linha do dia */
.today-card { background: var(--surface); border-radius: var(--r-lg); padding: 16px 18px 12px; margin-bottom: 18px; }
.today-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.today-head .h-sec { font-size: 18px; }
.date-chip { font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.live { display: inline-flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 5px 12px 5px 9px; font-size: 13px; max-width: 100%; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); flex: none; }
.live span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-scroll { overflow-x: auto; }
.tl { position: relative; min-width: 640px; }
.tl .hr { position: absolute; top: 0; bottom: 22px; border-left: 1px dashed var(--line); }
.tl .hl { position: absolute; bottom: 0; font-size: 11.5px; color: var(--muted); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.tl .evp { position: absolute; height: 38px; border-radius: 999px; color: #1A1119; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 13px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border: 0; text-align: left; box-shadow: 0 8px 18px rgba(0, 0, 0, .2); }
.tl .evp b { font-weight: 700; font-variant-numeric: tabular-nums; }
.tl .now { position: absolute; top: 0; bottom: 22px; border-left: 2px solid var(--ink); z-index: 2; }
.tl .now span { position: absolute; top: -4px; left: -22px; background: var(--ink); color: var(--bg); font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
.tl-free { color: var(--muted); font-size: 14px; padding: 6px 0 4px; }

/* Meta */
.goal { position: relative; overflow: hidden; border-radius: var(--r-lg); background: var(--surface); padding: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.goal .bubble { position: absolute; border-radius: 50%; pointer-events: none; }
.goal .b1 { width: 240px; height: 240px; right: -70px; top: -110px; background: radial-gradient(circle at 35% 35%, var(--pink), var(--pink-2) 70%); opacity: .5; }
.goal .b2 { width: 150px; height: 150px; right: 90px; top: -90px; background: radial-gradient(circle at 35% 35%, var(--lav), transparent 72%); opacity: .5; }
.ringwrap { position: relative; width: 150px; height: 150px; }
.ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ringwrap .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ringwrap .lbl b { font: 700 38px/1 var(--f-d); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.ringwrap .lbl b small { font-size: .5em; }
.ringwrap .lbl span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.goal-txt { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.goal-txt .eyebrow { font-size: 13px; color: var(--muted); }
.goal-txt .amt { font-size: 15px; color: var(--muted); }
.goal-txt .amt b { color: var(--ink); font: 600 20px var(--f-d); letter-spacing: -.02em; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.chip-y { border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; color: var(--on-color); display: inline-flex; gap: 6px; align-items: center; }
.chip-y b { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip-y.y { background: var(--yellow); }
.chip-y.p { background: var(--pink); }

/* Pílulas de dias */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.day { background: var(--surface); border-radius: 999px; padding: 12px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 88px; justify-content: center; }
.day:hover { background: var(--surface-3); }
.day .st { height: 16px; display: grid; place-items: center; color: var(--yellow); }
.day .st svg { width: 14px; height: 14px; }
.day .wd { font-size: 12.5px; color: var(--muted); }
.day .dn { font: 600 16px var(--f-d); font-variant-numeric: tabular-nums; }
.day.on { background: linear-gradient(170deg, var(--pink), var(--lav)); border-color: transparent; color: var(--on-color); }
.day.on .wd { color: var(--on-color-soft); }
.day.on .st { color: var(--on-color); }

/* Cartões em degradê */
.plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.tile { border-radius: var(--r); padding: 18px; color: var(--on-color); position: relative; overflow: hidden; border: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 190px; isolation: isolate; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 18px 40px rgba(0, 0, 0, .25); transition: transform .2s; }
.tile:hover { transform: translateY(-3px); }
.tile::before { content: ""; position: absolute; border-radius: 50%; z-index: -1; }
.tile.g-pink { background: linear-gradient(160deg, #F7C3EA, var(--pink) 55%, var(--pink-2)); }
.tile.g-pink::before { width: 170px; height: 170px; right: -40px; top: -50px; background: radial-gradient(circle at 35% 35%, #FBD9F1, var(--pink-2) 75%); opacity: .8; }
.tile.g-peri { background: linear-gradient(160deg, #C9D0FB, var(--peri) 60%, #8E8CF0); }
.tile.g-peri::before { width: 150px; height: 150px; right: -30px; top: -40px; background: radial-gradient(circle at 35% 35%, #E3E6FD, #8E8CF0 75%); opacity: .8; }
.tile.g-yellow { background: linear-gradient(160deg, #FAF0B0, var(--yellow) 60%, #EFC85E); }
.tile.g-lav { background: linear-gradient(160deg, #DED3FD, var(--lav) 60%, #A890F3); }
.tile.g-lav::before { width: 160px; height: 160px; right: -40px; bottom: -60px; background: radial-gradient(circle at 35% 35%, #F7C3EA, var(--pink) 75%); opacity: .6; }
.tile.g-gray { background: var(--surface); color: var(--ink); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
.tile .arrow { position: absolute; right: 14px; top: 14px; }
.tile .tg { align-self: flex-start; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: rgba(255, 255, 255, .6); color: #1A1119; margin-top: auto; }
.tile .t { font: 600 21px/1.15 var(--f-d); letter-spacing: -.03em; overflow-wrap: anywhere; padding-right: 30px; }
.tile .d { font-size: 14px; line-height: 1.35; color: var(--on-color-soft); padding-right: 36px; }
.tile.g-gray .d { color: var(--muted); }
.tile .tbar { height: 5px; border-radius: 999px; background: rgba(26, 17, 25, .18); overflow: hidden; margin-top: 10px; }
.tile .tbar i { display: block; height: 100%; background: var(--on-color); border-radius: 999px; }
.tile.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 10px; }
.count { background: rgba(255, 255, 255, .7); color: #1A1119; border-radius: 999px; padding: 8px 14px; font-weight: 500; font-size: 14px; display: inline-flex; gap: 6px; align-items: baseline; }
.count b { font: 700 17px var(--f-d); font-variant-numeric: tabular-nums; }
.count.bad b { color: #C42644; }

/* Semana */
.wstats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.wstat { background: var(--surface-2); border-radius: 20px; padding: 14px 16px; min-width: 0; }
.wstat .k { font-size: 13px; color: var(--muted); }
.wstat .v { font: 600 30px/1.1 var(--f-d); letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.delta { font: 700 12px var(--f); border-radius: 999px; padding: 2px 8px; letter-spacing: 0; }
.delta.up { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.delta.down { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
.delta.flat { background: var(--surface-3); color: var(--muted); }
.wbars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 120px; margin-top: 16px; }
.wbar { display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.wbar i { width: 100%; max-width: 34px; border-radius: 12px; background: var(--surface-3); min-height: 6px; }

/* Cartões dos meses (paisagem + nome gigante) */

/* Metas em linha do tempo */

/* Filtros */

/* Quadros */

.col { background: var(--surface); border-radius: var(--r-lg); padding: 12px; min-height: 180px; outline: 2px dashed transparent; outline-offset: -2px; transition: outline-color .15s; }

.bg-pink { background: var(--pink); } .bg-lav { background: var(--lav); } .bg-peri { background: var(--peri); } .bg-yellow { background: var(--yellow); } .bg-gray { background: var(--surface-3); color: var(--ink) !important; }

.cell { min-height: 92px; border-radius: 16px; background: var(--surface-2); border: 1.5px solid transparent; padding: 7px; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; overflow: hidden; }

/* Busca e modais */

  // ---------- Vocabulário ----------

  const PROJECT_BAR = { briefing: 'var(--lav)', producao: 'var(--pink)', revisao: 'var(--yellow)', entregue: 'var(--peri)', pausado: 'var(--surface-3)' };
  const SERVICES = ['Site', 'Redes sociais', 'Branding', 'App / web app', 'Conteúdo para eventos', 'Estratégia digital', 'Outro'];

  const KIND_COLOR = { events: 'var(--pink)', tasks: 'var(--yellow)', projects: 'var(--peri)', contacts: 'var(--lav)', finance: 'var(--mint)', milestones: 'var(--yellow)' };
  const KIND_NAME = { events: 'Compromisso', tasks: 'Tarefa', projects: 'Entrega de projeto', contacts: 'Retorno de cliente' };
  const EV_COLORS = ['var(--pink)', 'var(--lav)', 'var(--yellow)', 'var(--peri)'];
  const label = (list, key) => (list.find(([k]) => k === key) || [, ''])[1];

  // ---------- Utilidades ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const slug = s => String(s || '').normalize('NFD').replace(/\p{M}/gu, '').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || 'pessoa';
  const brl = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(Number(v) || 0);
  const brlShort = v => { v = Number(v) || 0; const a = Math.abs(v); return a >= 1000 ? (v < 0 ? '-' : '') + 'R$ ' + (a / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : brl(v); };
  const fmtH = min => { min = Math.round(min || 0); return min < 60 ? `${min} min` : (min / 60).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' h'; };
  const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(':'); };
  const WD = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const ym = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
  const monthName = key => MONTHS[Number(key.slice(5, 7)) - 1] + ' ' + key.slice(0, 4);
  const shiftMonth = (key, n) => { const [y, m] = key.split('-').map(Number); return ym(new Date(y, m - 1 + n, 1)); };
  function parseDate(s) { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
  function daysFrom(s) { const a = parseDate(s); if (!a) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((a - t) / 86400000); }
  function weekStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - x.getDay()); return x; }
  const localDay = iso => iso ? (String(iso).length <= 10 ? String(iso) : ymd(new Date(iso))) : '';
  function dueText(s) {
    const n = daysFrom(s); if (n === null) return '';
    if (n < 0) return `${-n}d de atraso`;
    if (n === 0) return 'hoje';
    if (n === 1) return 'amanhã';
    const d = parseDate(s);
    if (n < 7) return WD[d.getDay()].toLowerCase() + ' ' + pad(d.getDate());
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
  }
  function due(s, closed) {
    const n = daysFrom(s); if (n === null) return '';
    const cls = closed ? '' : n < 0 ? 'late' : n === 0 ? 'today' : '';
    return `<span class="due ${cls}">${esc(dueText(s))}</span>`;
  }
  const longDate = s => { const d = parseDate(s); return WD[d.getDay()].toLowerCase() + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()]; };

  const byDue = (a, b) => (a.due || a.nextDate || a.date || '9999').localeCompare(b.due || b.nextDate || b.date || '9999');
  const prioRank = { alta: 0, media: 1, baixa: 2 };
  const inMonth = (iso, key) => !!iso && localDay(iso).slice(0, 7) === key;
  const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); };
  function deltaBadge(cur, prev) {
