    ['#F2A27C', '#FCE1C2', '#FFF3DA', '#C9826B', '#8E4E50', '#4A2733'],
    ['#DE97C2', '#F9D3E1', '#FFEAF3', '#B77BA6', '#7E4B7E', '#3D2443'],
    ['#1B78C2', '#7DC1EA', '#E9F6FF', '#DCE7F2', '#8EA5BA', '#3E5568'],
    ['#94BEE0', '#D8E8EF', '#F5FBF2', '#73A05A', '#4B7A3A', '#2C4A22'],
    ['#8CA6C7', '#DCC4AE', '#F8E3CB', '#C8693E', '#9C4A2A', '#5E2A18'],
    ['#B1A1E6', '#E6DDF8', '#F8F2FF', '#8E7BC9', '#5F4F9A', '#2F2759'],
    ['#0E1A3A', '#2D4378', '#A9C0FF', '#3A4E86', '#22335E', '#101A36'],
    ['#E6A23C', '#F7D88A', '#FFF2C8', '#C98236', '#8E5626', '#4A2C15'],
    ['#36A19C', '#A6DED4', '#E8FBF6', '#2F8A84', '#1F625E', '#0F3533'],
    ['#4E2652', '#D27FB8', '#FFD3EE', '#8C4A86', '#5E2C5E', '#2C1230'],
    ['#D47C27', '#F4C27A', '#FFE8C0', '#A35A2A', '#713A1C', '#3A1C0E'],
    ['#132C66', '#4E74C4', '#D2E2FF', '#2D4E96', '#1B3369', '#0C1A3C']
  ];
  let gid = 0;
  function landscape(mi, year) {
    const p = PALETTES[mi]; const g = 'ls' + (++gid);
    let s = (year * 31 + mi * 977) % 233280;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const ridge = (base, amp, n) => {
      const pts = Array.from({ length: n + 1 }, (_, i) => [i * 400 / n, base - rnd() * amp]);
      let d = `M0 250 L0 ${pts[0][1].toFixed(1)}`;
      for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; d += ` Q${x0.toFixed(1)} ${y0.toFixed(1)} ${((x0 + x1) / 2).toFixed(1)} ${((y0 + y1) / 2).toFixed(1)}`; }
      return d + ` L400 ${pts[n][1].toFixed(1)} L400 250 Z`;
    };
    const sunX = 80 + rnd() * 240, sunY = 50 + rnd() * 40;
    return `<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
      <linearGradient id="${g}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient>
      <radialGradient id="${g}g"><stop offset="0" stop-color="${p[2]}" stop-opacity=".95"/><stop offset="1" stop-color="${p[2]}" stop-opacity="0"/></radialGradient>
      <linearGradient id="${g}h" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs>
      <rect width="400" height="250" fill="url(#${g}s)"/>
      <circle cx="${sunX.toFixed(0)}" cy="${sunY.toFixed(0)}" r="70" fill="url(#${g}g)"/>
      <path d="${ridge(150, 75, 5)}" fill="${p[3]}" opacity=".92"/>
      <path d="${ridge(192, 50, 6)}" fill="${p[4]}"/>
      <path d="${ridge(228, 30, 8)}" fill="${p[5]}"/>
      <rect width="400" height="250" fill="url(#${g}h)"/></svg>`;
  }

  // ---------- Armazenamento (compartilhado via Claude, ou local como reserva) ----------
  const store = {
    db: null, mode: 'loading', listeners: {},
    key: c => 'dna-central:' + c,
    lsRead(c) { try { return JSON.parse(localStorage.getItem(this.key(c)) || 'null'); } catch (e) { return null; } },
    lsWrite(c, v) { try { localStorage.setItem(this.key(c), JSON.stringify(v)); } catch (e) {} },
    async init() {
      let db = null;
      try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) { db = null; }
      this.db = db; this.mode = db ? 'shared' : 'local';
    },
    watch(c, cb) {
      if (this.db) this.db.collection(c).onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => ({ ...d.data(), id: d.id }))), dbError);
      else { this.listeners[c] = cb; cb(this.lsRead(c) || []); }
    },
    watchDoc(path, cb) {
      if (this.db) this.db.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null), dbError);
      else { this.listeners[path] = cb; cb(this.lsRead(path)); }
    },
    async save(c, id, data) {
      if (this.db) return this.db.collection(c).doc(id).set(data);
      const arr = (this.lsRead(c) || []).filter(x => x.id !== id); arr.push({ ...data, id });
      this.lsWrite(c, arr); this.listeners[c] && this.listeners[c](arr);
    },
    async patch(c, id, data) {
      if (this.db) return this.db.collection(c).doc(id).update(data);
      const arr = (this.lsRead(c) || []).map(x => x.id === id ? { ...x, ...data } : x);
      this.lsWrite(c, arr); this.listeners[c] && this.listeners[c](arr);
    },
    async remove(c, id) {
      if (this.db) return this.db.collection(c).doc(id).delete();
      const arr = (this.lsRead(c) || []).filter(x => x.id !== id);
      this.lsWrite(c, arr); this.listeners[c] && this.listeners[c](arr);
    },
    async saveDoc(path, data) {
      if (this.db) return this.db.doc(path).set(data);
      this.lsWrite(path, data); this.listeners[path] && this.listeners[path](data);
    }
  };

  function dbError(e) {
    const code = e && e.code;
    if (code === 'revoked') toast('Seu acesso a estes dados mudou. Recarregue a página.', true);
    else if (code === 'quota_exceeded') toast('O espaço de dados está cheio. Exclua itens antigos para criar novos.', true);
    else toast('Não foi possível carregar os dados agora. Recarregue a página.', true);
  }
  async function write(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === 'invalid_argument') toast('Você não tem permissão para editar. Peça acesso de Colaborador ou Editor.', true);
      else if (code === 'quota_exceeded') toast('O espaço de dados está cheio. Exclua itens antigos e tente de novo.', true);
      else toast('Não salvou. Verifique a conexão e tente de novo.', true);
      return false;
    }
  }

  // ---------- Estado ----------
  const VIEWS = ['inicio', 'tarefas', 'agenda', 'projetos', 'clientes', 'financas', 'metas'];
  const COLLS = ['tasks', 'projects', 'contacts', 'events', 'goals', 'timers', 'timelogs', 'notes', 'finance', 'milestones'];
  const hashView = (location.hash || '').replace('#', '');
  const now0 = new Date();
  const state = {
    view: VIEWS.includes(hashView) ? hashView : 'inicio',
    team: DEFAULT_TEAM.slice(), loaded: {}, look: null,
    taskOwner: 'todos', taskProject: '', taskQuick: '', projFilter: 'ativos', projMode: 'cards',
    crmHeat: '', crmQuery: '', finMonth: ym(now0), finType: '', metaYear: now0.getFullYear(),
    agendaDate: ymd(now0), agendaMonth: ym(now0),
    me: ''
  };
  COLLS.forEach(c => { state[c] = []; state.loaded[c] = false; });
  try {
    const v = localStorage.getItem('dna-central:view'); if (!hashView && VIEWS.includes(v)) state.view = v;
    state.me = localStorage.getItem('dna-central:me') || '';
  } catch (e) {}

  // ---------- Pedaços visuais ----------
  const teamIdx = name => { const i = state.team.indexOf(name); return i < 0 ? 0 : i % 4; };
  const AV_BG = ['var(--pink)', 'var(--lav)', 'var(--yellow)', 'var(--peri)'];
  function avatar(name) {
    if (!name) return '<span class="avatar none" title="Sem responsável">?</span>';
    return `<span class="avatar c${teamIdx(name)}" title="${esc(name)}">${esc(name.trim().charAt(0).toUpperCase())}</span>`;
  }
  const projectName = id => { const p = state.projects.find(p => p.id === id); return p ? p.name : ''; };
  function waLink(n) {
    let d = String(n || '').replace(/\D/g, ''); if (!d) return '';
    if (d.length <= 11) d = '55' + d;
    return `<a class="link" href="https://wa.me/${d}" target="_blank" rel="noopener">WhatsApp</a>`;
  }
  function igLink(h) {
    const u = String(h || '').trim().replace(/^@/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//, '').replace(/\/.*$/, '');
    if (!u) return '';
    return `<a class="link" href="https://instagram.com/${encodeURIComponent(u)}" target="_blank" rel="noopener">@${esc(u)}</a>`;
  }
  function heatMeter(h) {
    if (!h) return '';
    const n = HEAT_DOTS[h] || 0;
    return `<span class="heat ${h}"><span class="dots5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'f' : ''}"></i>`).join('')}</span>${esc(label(HEAT, h))}</span>`;
  }

  // Tudo o que cai num dia: compromissos, prazos de tarefas, entregas e retornos
  function itemsOn(day) {
    const out = [];
    state.events.filter(e => e.date === day).forEach(e => out.push({ kind: 'events', id: e.id, title: e.title, time: e.start || '', end: e.end || '', sub: [e.type, e.owner, e.place].filter(Boolean).join(' · ') }));
    state.tasks.filter(t => t.due === day && t.status !== 'done').forEach(t => out.push({ kind: 'tasks', id: t.id, title: t.title, time: '', sub: [projectName(t.projectId), t.owner].filter(Boolean).join(' · ') }));
    state.projects.filter(p => p.due === day && p.status !== 'entregue').forEach(p => out.push({ kind: 'projects', id: p.id, title: 'Entrega: ' + p.name, time: '', sub: [p.client, p.owner].filter(Boolean).join(' · ') }));
    state.contacts.filter(c => c.nextDate === day && !['fechado', 'perdido'].includes(c.stage)).forEach(c => out.push({ kind: 'contacts', id: c.id, title: c.nextAction || ('Retornar ' + c.name), time: '', sub: [c.name, c.company].filter(Boolean).join(' · ') }));
    return out.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  }

  // Avisos: o que está atrasado ou pede ação hoje
  function alerts() {
    const out = [];
    state.tasks.filter(t => t.status !== 'done' && daysFrom(t.due) !== null && daysFrom(t.due) < 0).sort(byDue)
      .forEach(t => out.push({ g: 'Atrasado', kind: 'tasks', id: t.id, title: t.title, sub: 'Tarefa · ' + dueText(t.due) + (t.owner ? ' · ' + t.owner : '') }));
    state.contacts.filter(c => !['fechado', 'perdido'].includes(c.stage) && daysFrom(c.nextDate) !== null && daysFrom(c.nextDate) < 0)
      .forEach(c => out.push({ g: 'Atrasado', kind: 'contacts', id: c.id, title: c.nextAction || 'Retornar ' + c.name, sub: 'Cliente · ' + c.name + ' · ' + dueText(c.nextDate) }));
    itemsOn(ymd(new Date())).forEach(x => out.push({ g: 'Hoje', kind: x.kind, id: x.id, title: x.title, sub: KIND_NAME[x.kind] + (x.time ? ' · ' + x.time : '') }));
    state.projects.filter(p => p.status !== 'entregue' && [1, 2].includes(daysFrom(p.due)))
      .forEach(p => out.push({ g: 'Próximos dias', kind: 'projects', id: p.id, title: 'Entrega: ' + p.name, sub: 'Projeto · ' + dueText(p.due) }));
    return out;
  }

  // ---------- Dinheiro: receitas, despesas, investimentos, lucro e negociação ----------
  function money(key) {
    const g = state.goals.find(x => x.id === key) || {};
    const closed = state.contacts.filter(c => c.stage === 'fechado' && inMonth(c.closedAt || c.updatedAt, key));
    const fin = state.finance.filter(f => inMonth(f.date, key));
    const sum = (arr, k) => arr.reduce((s, x) => s + (Number(x[k]) || 0), 0);
    const crm = sum(closed, 'value');
    const extra = sum(fin.filter(f => f.type === 'receita'), 'amount') + (Number(g.revenueExtra) || 0);
    const expense = sum(fin.filter(f => f.type === 'despesa'), 'amount');
    const invest = sum(fin.filter(f => f.type === 'investimento'), 'amount');
    const revenue = crm + extra;
    return { closed, fin, crm, extra, revenue, expense, invest, profit: revenue - expense, g };
  }
  function pipeline() {
    const open = state.contacts.filter(c => ['contato', 'proposta'].includes(c.stage));
    const prob = c => c.heat ? HEAT_PROB[c.heat] : (c.stage === 'proposta' ? .5 : .2);
    return { open, total: open.reduce((s, c) => s + (Number(c.value) || 0), 0), likely: open.reduce((s, c) => s + (Number(c.value) || 0) * prob(c), 0), prob };
  }
  function yearTotals(year) {
    return Array.from({ length: 12 }, (_, i) => money(year + '-' + pad(i + 1))).reduce((a, m) => ({ revenue: a.revenue + m.revenue, expense: a.expense + m.expense, invest: a.invest + m.invest, profit: a.profit + m.profit, deals: a.deals + m.closed.length }), { revenue: 0, expense: 0, invest: 0, profit: 0, deals: 0 });
  }

  // ---------- Metas ----------
  function goalStatsFor(key) {
    const m = money(key); const g = m.g;
    const leads = state.contacts.filter(c => inMonth(c.createdAt, key)).length;
    const pct = (v, t) => t > 0 ? Math.round(v / t * 100) : null;
    return {
      key, g, monthName: MONTHS[Number(key.slice(5, 7)) - 1],
      revenue: m.revenue, revenueT: Number(g.revenue) || 0, revenueP: pct(m.revenue, Number(g.revenue)),
      deals: m.closed.length, dealsT: Number(g.deals) || 0, dealsP: pct(m.closed.length, Number(g.deals)),
      leads, leadsT: Number(g.leads) || 0, leadsP: pct(leads, Number(g.leads))
    };
  }
  const goalStats = () => goalStatsFor(ym(new Date()));
  function msValue(m) {
    const y = Number(String(m.date || '').slice(0, 4)) || new Date().getFullYear();
    const t = yearTotals(y);
    if (m.metric === 'receita_ano') return t.revenue;
    if (m.metric === 'lucro_ano') return t.profit;
    if (m.metric === 'contratos_ano') return t.deals;
    if (m.metric === 'clientes_ano') return state.contacts.filter(c => String(localDay(c.createdAt)).startsWith(String(y))).length;
    return Number(m.current) || 0;
  }
  const msMoney = m => ['receita_ano', 'lucro_ano'].includes(m.metric);
  function ring(p) {
    const r = 62, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, p || 0));
    return `<svg viewBox="0 0 150 150" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--yellow)"/><stop offset=".5" stop-color="var(--pink)"/><stop offset="1" stop-color="var(--lav)"/></linearGradient></defs>
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="12"/>
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
  }

  // Faturamento dos últimos 6 meses em degraus, com a meta do mês tracejada
  function revenueChart() {
    const now = new Date();
    const months = Array.from({ length: 6 }, (_, i) => new Date(now.getFullYear(), now.getMonth() - 5 + i, 1));
    const vals = months.map(d => money(ym(d)).revenue);
    const target = Number((state.goals.find(x => x.id === ym(now)) || {}).revenue) || 0;
    const max = Math.max(1, ...vals, target) * 1.15;
    const W = 360, H = 180, top = 22, bottom = 26, ph = H - top - bottom, bw = W / 6;
    const y = v => top + ph - (v / max) * ph;
    const bars = vals.map((v, i) => {
      const x = i * bw, yy = y(v), cur = i === 5;
      return `<rect x="${x + 1}" y="${yy}" width="${bw - 2}" height="${top + ph - yy}" fill="url(#bf${cur ? 'c' : ''})"/>
        <rect x="${x + 1}" y="${yy}" width="${bw - 2}" height="3" rx="1.5" fill="${cur ? 'var(--pink)' : 'var(--surface-3)'}"/>
        <text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${MONTHS[months[i].getMonth()].slice(0, 3)}</text>
        ${v ? `<text x="${x + bw / 2}" y="${yy - 7}" text-anchor="middle" font-size="10.5" fill="${cur ? 'var(--ink)' : 'var(--muted)'}" font-weight="${cur ? 600 : 400}">${esc(brlShort(v))}</text>` : ''}`;
    }).join('');
    const ty = y(target);
    const tline = target ? `<line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/>
      <rect x="2" y="${ty - 11}" width="84" height="22" rx="11" fill="var(--ink)"/><text x="44" y="${ty + 4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--bg)">Meta ${esc(brlShort(target))}</text>` : '';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento dos últimos 6 meses">
      <defs><linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--surface-3)"/><stop offset="1" stop-color="var(--surface-3)" stop-opacity="0"/></linearGradient>
      <linearGradient id="bfc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pink)" stop-opacity=".85"/><stop offset="1" stop-color="var(--pink)" stop-opacity="0"/></linearGradient></defs>
      ${bars}${tline}</svg>`;
  }

  // Ano inteiro: receita x despesa por mês, com o lucro em linha
  function yearChart(year) {
    const ms = Array.from({ length: 12 }, (_, i) => money(year + '-' + pad(i + 1)));
    const W = 600, H = 230, top = 24, bottom = 26, ph = H - top - bottom, bw = W / 12;
    const max = Math.max(1, ...ms.map(m => Math.max(m.revenue, m.expense, m.profit))) * 1.12;
    const min = Math.min(0, ...ms.map(m => m.profit)) * 1.12;
    const y = v => top + (max - v) / (max - min) * ph;
    const zero = y(0);
    const curKey = ym(new Date());
    const parts = ms.map((m, i) => {
      const x = i * bw, key = year + '-' + pad(i + 1), cur = key === curKey, sel = key === state.finMonth;
      const r = y(m.revenue), e = y(m.expense);
      return `${sel ? `<rect x="${x + 2}" y="${top - 14}" width="${bw - 4}" height="${ph + 14}" rx="10" fill="var(--surface-2)"/>` : ''}
        <rect x="${x + bw * .2}" y="${r}" width="${bw * .28}" height="${Math.max(0, zero - r)}" rx="4" fill="var(--pink)"/>
        <rect x="${x + bw * .52}" y="${e}" width="${bw * .28}" height="${Math.max(0, zero - e)}" rx="4" fill="var(--lav)" opacity=".85"/>
        <text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="12" fill="${cur ? 'var(--ink)' : 'var(--muted)'}" font-weight="${cur ? 700 : 400}">${MONTHS[i].slice(0, 3)}</text>
        <rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent" data-finmonth="${key}" style="cursor:pointer"><title>${cap(MONTHS[i])}: receita ${brl(m.revenue)}, despesas ${brl(m.expense)}, lucro ${brl(m.profit)}</title></rect>`;
    }).join('');
    const pts = ms.map((m, i) => `${(i * bw + bw / 2).toFixed(1)},${y(m.profit).toFixed(1)}`).join(' ');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita, despesas e lucro por mês em ${year}">
      <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="1"/>
      ${parts}
      <polyline points="${pts}" fill="none" stroke="var(--yellow)" stroke-width="2.5" stroke-linejoin="round" pointer-events="none"/>
      ${ms.map((m, i) => `<circle cx="${(i * bw + bw / 2).toFixed(1)}" cy="${y(m.profit).toFixed(1)}" r="3.5" fill="var(--yellow)" pointer-events="none"/>`).join('')}</svg>`;
  }

  // ---------- Cronômetro ----------
  const myTimer = () => state.me ? state.timers.find(t => t.who === state.me) : null;
  const logsMinutes = logs => logs.reduce((s, l) => s + (Number(l.minutes) || 0), 0);
  function projectMinutes(pid) {
    const taskIds = new Set(state.tasks.filter(t => t.projectId === pid).map(t => t.id));
    return logsMinutes(state.timelogs.filter(l => l.projectId === pid || (l.taskId && taskIds.has(l.taskId))));
  }
  async function startTimer(taskId) {
    if (!state.me) return openWho('Para marcar horas, escolha quem você é.');
    const task = state.tasks.find(t => t.id === taskId); if (!task) return;
    if (myTimer()) await stopTimer(true);
    await write(() => store.save('timers', slug(state.me), { who: state.me, taskId, projectId: task.projectId || '', label: task.title, startedAt: new Date().toISOString() }), 'Cronômetro ligado: ' + task.title);
  }
  async function stopTimer(silent) {
    const t = myTimer(); if (!t) return;
    const end = new Date(); const minutes = Math.round((end - new Date(t.startedAt)) / 60000);
    if (minutes >= 1) await write(() => store.save('timelogs', uid(), { who: t.who, taskId: t.taskId || '', projectId: t.projectId || '', label: t.label || '', start: t.startedAt, end: end.toISOString(), minutes }));
    await write(() => store.remove('timers', t.id), silent ? '' : (minutes >= 1 ? `Registrado: ${fmtH(minutes)} em ${t.label}` : 'Cronômetro parado (menos de 1 minuto não conta)'));
  }
  function renderTimerBar() {
    const t = myTimer();
    $('#timer-root').innerHTML = t ? `<div class="timerbar" role="status"><span class="dot"></span><span class="clock" id="tb-clock">${clock(Date.now() - new Date(t.startedAt))}</span><span class="lbl">${esc(t.label)}</span><button class="stop" data-stop aria-label="Parar e registrar">${ICON_STOP}</button></div>` : '';
  }
  setInterval(() => {
    const t = myTimer(); const el = $('#tb-clock');
    if (t && el) el.textContent = clock(Date.now() - new Date(t.startedAt));
    document.querySelectorAll('[data-tick]').forEach(b => { const tt = state.timers.find(x => x.id === b.dataset.tick); if (tt) b.lastChild.textContent = clock(Date.now() - new Date(tt.startedAt)).slice(3); });
  }, 1000);

  // ---------- Fotos: fundo do sistema e capa do Início ----------
  let assetsNs;
  async function getAssets() {
    if (assetsNs !== undefined) return assetsNs;
    try { assetsNs = window.claude && window.claude.use ? await window.claude.use('assets') : null; } catch (e) { assetsNs = null; }
    return assetsNs;
  }
  const PHOTO = { bg: { field: 'bgId', local: 'dna-central:bgdata', title: 'Foto de fundo', note: 'A foto fica atrás de tudo, com o efeito de vidro fosco por cima.', done: 'Fundo trocado', reset: 'Voltar ao fundo padrão' },
    cover: { field: 'coverId', local: 'dna-central:coverdata', title: 'Foto de capa', note: 'A capa aparece no topo do Início, acima das metas. Fotos na horizontal ficam melhores.', done: 'Capa trocada', reset: 'Voltar à capa padrão' } };
  function photoUrl(kind) {
    const P = PHOTO[kind];
    if (store.mode === 'local') { try { return localStorage.getItem(P.local) || ''; } catch (e) { return ''; } }
    return state.look && state.look[P.field] ? '/_blob/' + state.look[P.field] : '';
  }
  const bgUrl = () => photoUrl('bg');
  function applyBackdrop() {
    const u = bgUrl(); const b = $('#backdrop');
    b.classList.toggle('photo', !!u);
    b.style.backgroundImage = u ? `url("${u.replace(/"/g, '%22')}")` : '';
  }

  // ---------- Telas ----------
  function coverCard() {
    const u = photoUrl('cover'); const now = new Date(); const today = ymd(now);
    const open = state.tasks.filter(t => t.status !== 'done');
    const todayT = open.filter(t => t.due === today).length;
    const late = open.filter(t => daysFrom(t.due) !== null && daysFrom(t.due) < 0).length;
    const evs = state.events.filter(e => e.date === today).length;
    const first = (state.me || '').trim().split(/\s+/)[0];
    return `
      <section class="cover" style="${u ? `background-image:url('${u.replace(/'/g, '%27')}')` : ''}" aria-label="Capa">
        ${u ? '' : landscape(now.getMonth(), now.getFullYear())}
        <button class="cv-btn" id="btn-cover" type="button" title="Trocar a foto de capa" aria-label="Trocar a foto de capa">${ICON_IMG}</button>
        <div class="cv-info">
          <b>${first ? 'Olá, ' + esc(first) : 'Olá, equipe DNA'}</b>
          <span>${esc(cap(longDate(today)))}</span>
          <span>${evs} compromisso${evs === 1 ? '' : 's'} · ${todayT} tarefa${todayT === 1 ? '' : 's'} hoje${late ? ` · ${late} atrasada${late === 1 ? '' : 's'}` : ''}</span>
        </div>
      </section>`;
  }

  function todayCard() {
    const day = ymd(new Date());
    const evs = state.events.filter(e => e.date === day);
    const timed = evs.filter(e => e.start).sort((a, b) => a.start.localeCompare(b.start));
    const allDay = evs.filter(e => !e.start);
    const H0 = 7 * 60, H1 = 22 * 60, span = H1 - H0;
    const lanes = [];
    const pills = timed.map((e, i) => {
      const s = Math.max(H0, Math.min(H1 - 30, toMin(e.start)));
      const en = Math.max(s + 45, Math.min(H1, toMin(e.end) || s + 60));
      let lane = lanes.findIndex(endAt => endAt <= s); if (lane < 0) { lane = lanes.length; lanes.push(0); } lanes[lane] = en;
      return `<button class="evp" data-open="events:${e.id}" style="left:${(s - H0) / span * 100}%;width:${(en - s) / span * 100}%;top:${8 + lane * 44}px;background:${EV_COLORS[i % 4]}" title="${esc(e.start + ' ' + e.title)}"><b>${esc(e.start)}</b>${esc(e.title)}</button>`;
    }).join('');
    const height = Math.max(1, lanes.length) * 44 + 34;
    const hours = Array.from({ length: 8 }, (_, i) => 7 + i * 2).map(h => `<span class="hr" style="left:${(h * 60 - H0) / span * 100}%"></span><span class="hl" style="left:${(h * 60 - H0) / span * 100}%">${pad(h)}h</span>`).join('');
    const n = new Date(); const nm = n.getHours() * 60 + n.getMinutes();
    const nowLine = nm >= H0 && nm <= H1 ? `<span class="now" style="left:${(nm - H0) / span * 100}%"><span>agora</span></span>` : '';
    const live = state.timers.map(t => `<span class="live"><i></i><span><b>${esc(t.who)}</b> em ${esc(t.label)} · ${fmtH(Math.round((Date.now() - new Date(t.startedAt)) / 60000))}</span></span>`).join('');
    const tasksToday = state.tasks.filter(t => t.status !== 'done' && t.due === day).length;
    return `
      <section class="today-card" aria-label="Agenda de hoje">
        <div class="today-head"><h2 class="h-sec">Agenda de hoje</h2><span class="date-chip">${esc(longDate(day))}</span>
          ${allDay.map(e => `<button class="mini" data-open="events:${e.id}">${esc(e.title)}</button>`).join('')}
          ${tasksToday ? `<button class="mini" data-go="tarefas">${tasksToday} tarefa${tasksToday === 1 ? '' : 's'} vencem hoje</button>` : ''}
          ${live}</div>
        ${timed.length ? `<div class="tl-scroll"><div class="tl" style="height:${height}px">${hours}${pills}${nowLine}</div></div>`
          : `<div class="tl-free">Nenhum horário marcado hoje. <button class="mini" data-new="events">+ Marcar compromisso</button></div>`}
      </section>`;
  }

  function weekCard() {
    const ws = weekStart(new Date()); const prevWs = new Date(ws); prevWs.setDate(ws.getDate() - 7);
    const doneDay = t => localDay(t.doneAt || t.updatedAt);
    const done = state.tasks.filter(t => t.status === 'done');
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(ws); d.setDate(ws.getDate() + i); return ymd(d); });
    const counts = days.map(k => done.filter(t => doneDay(t) === k).length);
    const thisW = counts.reduce((a, b) => a + b, 0);
    const prevDays = Array.from({ length: 7 }, (_, i) => { const d = new Date(prevWs); d.setDate(prevWs.getDate() + i); return ymd(d); });
    const lastW = done.filter(t => prevDays.includes(doneDay(t))).length;
    const logsW = state.timelogs.filter(l => days.includes(localDay(l.start)));
    const logsL = state.timelogs.filter(l => prevDays.includes(localDay(l.start)));
    const minW = logsMinutes(logsW), minL = logsMinutes(logsL);
    const max = Math.max(1, ...counts); const todayK = ymd(new Date());
    const bars = counts.map((c, i) => `<div class="wbar ${days[i] === todayK ? 'today' : ''}"><b>${c || ''}</b><i style="height:${Math.max(6, c / max * 80)}px"></i><span>${WD[i]}</span></div>`).join('');
    const per = state.team.map(m => ({ m, min: logsMinutes(logsW.filter(l => l.who === m)) }));
    const maxM = Math.max(1, ...per.map(p => p.min));
    return `
      <section class="panel" aria-label="Semana">
        <div class="wstats">
          <div class="wstat"><div class="k">Tarefas concluídas</div><div class="v">${thisW} ${deltaBadge(thisW, lastW)}</div></div>
          <div class="wstat"><div class="k">Horas registradas</div><div class="v">${fmtH(minW)} ${deltaBadge(minW, minL)}</div></div>
        </div>
        <div class="wbars" aria-label="Tarefas concluídas por dia">${bars}</div>
        <div class="hours">${per.map(p => `<div class="hrow">${avatar(p.m)}<span style="min-width:70px">${esc(p.m)}</span><span class="hb"><i style="width:${p.min / maxM * 100}%"></i></span><b>${fmtH(p.min)}</b></div>`).join('')}</div>
      </section>`;
  }

  function notesCard() {
    const ns = state.notes.slice().sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')).slice(-40);
    const body = ns.length ? ns.map(n => {
      const mine = n.who === state.me;
      const d = new Date(n.createdAt);
      const when = (ymd(d) === ymd(new Date()) ? '' : pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ') + pad(d.getHours()) + ':' + pad(d.getMinutes());
      return `<div class="msg ${mine ? 'mine' : ''}">${mine ? '' : avatar(n.who)}<div><div class="bub" data-open="notes:${n.id}" role="button" tabindex="0" title="Toque para editar ou apagar">${esc(n.text)}</div><small>${mine ? '' : esc(n.who) + ' · '}${when}${n.editedAt ? ' · <em>editado</em>' : ''}</small></div></div>`;
    }).join('') : '<div class="empty">Nenhum recado ainda. Deixe o primeiro para a equipe.</div>';
    return `
      <section class="panel" aria-label="Recados">
        <div class="chat" id="chat">${body}</div>
        <form class="chat-form" id="note-form"><input id="f-note" data-keep maxlength="500" placeholder="${state.me ? 'Escreva um recado…' : 'Escolha seu nome lá em cima para escrever'}" autocomplete="off"><button class="ic-btn" type="submit" aria-label="Enviar recado">${ICON_SEND}</button></form>
      </section>`;
  }

  function viewInicio() {
    const s = goalStats();
    const hasGoal = s.revenueT || s.dealsT || s.leadsT;
    const mainP = s.revenueT ? s.revenueP : s.dealsT ? s.dealsP : s.leadsP;
    const mainName = s.revenueT ? 'Faturamento' : s.dealsT ? 'Fechamentos' : 'Novos clientes';
    const mainAmt = s.revenueT ? `<b>${brl(s.revenue)}</b> de ${brl(s.revenueT)}` : s.dealsT ? `<b>${s.deals}</b> de ${s.dealsT} contratos` : `<b>${s.leads}</b> de ${s.leadsT} contatos`;
    const cheer = mainP >= 100 ? 'Meta batida!' : mainP >= 70 ? 'Falta pouco, continuem assim.' : mainP >= 40 ? 'Bom ritmo, dá para chegar lá.' : 'Começando o mês, bora acelerar.';
    const goal = hasGoal ? `
      <section class="goal" aria-label="Meta do mês">
        <span class="bubble b1"></span><span class="bubble b2"></span>
        <div class="ringwrap">${ring(mainP)}<div class="lbl"><div><b>${mainP}<small>%</small></b><span>da meta</span></div></div></div>
        <div class="goal-txt">
          <div class="eyebrow">Meta de ${s.monthName} · ${esc(cheer)}</div>
          <h1 class="h-xl">${mainName}</h1>
          <div class="amt">${mainAmt}</div>
          <div class="chips">
            ${s.revenueT && s.dealsT ? `<span class="chip-y y"><b>${s.deals}/${s.dealsT}</b> fechamentos · ${s.dealsP}%</span>` : ''}
            ${(s.revenueT || s.dealsT) && s.leadsT ? `<span class="chip-y p"><b>${s.leads}/${s.leadsT}</b> novos contatos · ${s.leadsP}%</span>` : ''}
            <button class="pill-btn small" data-goals="${s.key}" type="button">Editar metas</button>
            <button class="pill-btn small" data-go="metas" type="button">Linha do tempo</button>
          </div>
        </div>
      </section>` : `
      <section class="goal" aria-label="Meta do mês">
        <span class="bubble b1"></span><span class="bubble b2"></span>
        <div class="ringwrap">${ring(0)}<div class="lbl"><div><b>0<small>%</small></b><span>sem meta</span></div></div></div>
        <div class="goal-txt">
          <div class="eyebrow">Meta de ${s.monthName}</div>
          <h1 class="h-xl">Defina a meta do mês</h1>
          <div class="amt">Faturamento, contratos fechados e contatos novos. A porcentagem se atualiza sozinha com o funil.</div>
          <div class="chips"><button class="pill-btn solid" data-goals="${s.key}" type="button">Definir metas</button></div>
        </div>
      </section>`;

    const today = new Date(); today.setHours(0, 0, 0, 0);
    const ws = weekStart(today);
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(ws); d.setDate(ws.getDate() + i); return d; }).map(d => {
      const k = ymd(d); const has = itemsOn(k).length;
      return `<button class="day ${k === ymd(today) ? 'on' : ''}" data-day="${k}" aria-label="${esc(longDate(k))}${has ? ', ' + has + ' itens' : ''}"><span class="st">${has ? ICON_STAR : ''}</span><span class="wd">${WD[d.getDay()]}</span><span class="dn">${d.getDate()}</span></button>`;
    }).join('');

    const todayK = ymd(today);
    const ev = state.events.filter(e => e.date >= todayK).sort((a, b) => (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')))[0];
    const nextProj = state.projects.filter(p => p.due && !['entregue', 'pausado'].includes(p.status) && p.due >= todayK).sort(byDue)[0];
    const open = state.tasks.filter(t => t.status !== 'done');
    const late = open.filter(t => daysFrom(t.due) !== null && daysFrom(t.due) < 0);
    const todayT = open.filter(t => daysFrom(t.due) === 0);
    const arrow = `<span class="ic-btn sm light arrow">${ICON_UP}</span>`;
    const tileEv = ev ? `
      <button class="tile g-pink" data-open="events:${ev.id}">${arrow}
        <span class="d">${esc(dueText(ev.date) === 'hoje' ? 'Hoje' : longDate(ev.date))}${ev.start ? ' · ' + esc(ev.start) : ''}</span>
        <span class="tg">${esc(ev.type || 'Compromisso')}${ev.owner ? ' · ' + esc(ev.owner) : ''}</span>
        <span class="t">${esc(ev.title)}</span>
      </button>`
      : `<button class="tile g-pink" data-go="agenda">${arrow}<span class="d">Agenda</span><span class="tg">Vazia</span><span class="t">Marcar um compromisso</span></button>`;
    const tileProj = nextProj ? (() => {
      const ts = state.tasks.filter(t => t.projectId === nextProj.id); const dn = ts.filter(t => t.status === 'done').length;
      return `<button class="tile g-peri" data-open="projects:${nextProj.id}">${arrow}
        <span class="d">Entrega ${esc(dueText(nextProj.due))} · ${dn}/${ts.length} tarefas</span>
        <span class="tg">${esc(nextProj.service || 'Projeto')}</span>
        <span class="t">${esc(nextProj.name)}</span>
        <span class="tbar"><i style="width:${ts.length ? Math.round(dn / ts.length * 100) : 0}%"></i></span></button>`;
    })() : `<button class="tile g-peri" data-go="projetos">${arrow}<span class="d">Próxima entrega</span><span class="tg">Sem prazos</span><span class="t">Colocar datas nos projetos</span></button>`;
    const tileCounts = `<button class="tile g-yellow wide" data-go="tarefas"><span class="count ${late.length ? 'bad' : ''}"><b>${late.length}</b> atrasadas</span><span class="count"><b>${todayT.length}</b> para hoje</span><span class="count"><b>${open.length}</b> abertas</span></button>`;

    const focus = open.filter(t => { const n = daysFrom(t.due); return n !== null && n <= 3; })
      .sort((a, b) => byDue(a, b) || (prioRank[a.priority] ?? 1) - (prioRank[b.priority] ?? 1));
    const follow = state.contacts.filter(c => !['fechado', 'perdido'].includes(c.stage) && c.nextDate && daysFrom(c.nextDate) <= 7)
      .sort((a, b) => a.nextDate.localeCompare(b.nextDate));
    const focusHtml = focus.length ? `<div class="list">${focus.slice(0, 6).map(t => `
      <div class="row" data-open="tasks:${t.id}">
        <button class="check" data-toggle="${t.id}" aria-label="Marcar como feita"></button>
        <div class="row-main"><div class="row-title">${esc(t.title)}</div><div class="row-sub">${esc(projectName(t.projectId) || 'Sem projeto')}${t.owner ? ' · ' + esc(t.owner) : ''}</div></div>
        ${t.priority === 'alta' ? '<span class="hot">Alta</span>' : ''}${due(t.due)}
      </div>`).join('')}</div>` : `<div class="empty">Nada vencendo nos próximos 3 dias. Use <b>+</b> lá em cima para criar uma tarefa.</div>`;
    const followHtml = follow.length ? `<div class="list">${follow.map(c => `
      <div class="row" data-open="contacts:${c.id}">
        <span class="row-ic" style="background:var(--lav)">${esc(c.name.charAt(0).toUpperCase())}</span>
        <div class="row-main"><div class="row-title">${esc(c.name)}</div><div class="row-sub">${esc(c.nextAction || label(STAGES, c.stage))} · ${esc(dueText(c.nextDate))}</div></div>
        ${chev}
      </div>`).join('')}</div>` : `<div class="empty">Nenhum retorno agendado. Preencha <b>Próximo passo</b> num contato.</div>`;
    const mm = money(ym(new Date())); const pl = pipeline();

    return `
      ${coverCard()}
      ${todayCard()}
      <div class="home">
        <div>
          ${goal}
          <div class="days" aria-label="Esta semana">${days}</div>
          <div class="sec-head"><h2 class="h-sec">Seu plano</h2><button class="pill-btn small" data-go="agenda">Ver agenda</button></div>
          <div class="plan">${tileEv}${tileProj}${tileCounts}</div>
          <div class="sec-head"><h2 class="h-sec">Produtividade da semana</h2></div>
          ${weekCard()}
        </div>
        <div class="home-side">
          <div class="sec-head"><h2 class="h-sec">Dinheiro do mês</h2><button class="pill-btn small" data-go="financas">Finanças</button></div>
          <section class="panel chart-card">
            <div class="fin-mini">
              <div><span><i style="background:var(--pink)"></i>Receita</span><b>${brl(mm.revenue)}</b></div>
              <div><span><i style="background:var(--lav)"></i>Despesas</span><b>${brl(mm.expense)}</b></div>
              <div><span><i style="background:var(--yellow)"></i>Lucro</span><b style="color:${mm.profit < 0 ? 'var(--danger)' : 'inherit'}">${brl(mm.profit)}</b></div>
            </div>
            ${revenueChart()}
            <div class="legend"><span>Em negociação: <b style="color:var(--ink)">&nbsp;${brl(pl.total)}</b></span><span>Provável: <b style="color:var(--ink)">&nbsp;${brl(pl.likely)}</b></span></div>
          </section>
          <div class="sec-head"><h2 class="h-sec">Prazos próximos</h2><button class="pill-btn small" data-go="tarefas">Quadro</button></div>
          ${focusHtml}
          <div class="sec-head"><h2 class="h-sec">Retornos da semana</h2></div>
          ${followHtml}
          <div class="sec-head"><h2 class="h-sec">Recados da equipe</h2></div>
          ${notesCard()}
        </div>
      </div>`;
  }

  function taskCard(t) {
    const closed = t.status === 'done';
    const next = TASK_STATUS[TASK_STATUS.findIndex(([k]) => k === t.status) + 1];
    const pn = projectName(t.projectId);
    const run = state.timers.find(x => x.taskId === t.id);
    const mine = run && run.who === state.me;
    const timerBtn = closed ? '' : run
      ? (mine ? `<button class="mini stopping" data-stop data-tick="${run.id}" title="Parar e registrar">${ICON_STOP}<span>${clock(Date.now() - new Date(run.startedAt)).slice(3)}</span></button>`
              : `<span class="tag" title="${esc(run.who)} está trabalhando nisso">⏱ ${esc(run.who)}</span>`)
      : `<button class="mini play" data-timer="${t.id}" title="Ligar cronômetro" aria-label="Ligar cronômetro">${ICON_PLAY}</button>`;
    return `<div class="card ${closed ? 'done' : ''} ${run ? 'running' : ''}" draggable="true" data-drag="tasks:${t.id}" data-open="tasks:${t.id}" tabindex="0" role="button">
      <div class="card-top">${t.priority === 'alta' && !closed ? '<span class="hot">Alta</span>' : ''}${pn ? `<span class="tag">${esc(pn)}</span>` : ''}</div>
      <div class="card-title">${esc(t.title)}</div>
      <div class="card-meta">${avatar(t.owner)}${due(t.due, closed)}<span class="push">${timerBtn}${next ? `<button class="mini" data-move="tasks:${t.id}:${next[0]}">${esc(next[1])} →</button>` : ''}</span></div>
    </div>`;
  }

  function viewTarefas() {
    let list = state.tasks.slice();
    if (state.taskOwner !== 'todos') list = list.filter(t => t.owner === state.taskOwner);
    if (state.taskProject) list = list.filter(t => t.projectId === state.taskProject);
    if (state.taskQuick === 'hoje') list = list.filter(t => daysFrom(t.due) === 0);
    if (state.taskQuick === 'atrasadas') list = list.filter(t => t.status !== 'done' && daysFrom(t.due) !== null && daysFrom(t.due) < 0);
    if (state.taskQuick === 'alta') list = list.filter(t => t.priority === 'alta');
    const cols = TASK_STATUS.map(([k, name]) => {
      let items = list.filter(t => (t.status || 'todo') === k);
      if (k === 'done') items.sort((a, b) => (b.doneAt || b.updatedAt || '').localeCompare(a.doneAt || a.updatedAt || ''));
      else items.sort((a, b) => byDue(a, b) || (prioRank[a.priority] ?? 1) - (prioRank[b.priority] ?? 1));
      const shown = k === 'done' ? items.slice(0, 25) : items;
      const body = shown.length ? shown.map(taskCard).join('') : `<div class="col-empty">${k === 'todo' ? 'Use + Nova tarefa para começar' : 'Arraste uma tarefa para cá'}</div>`;
      return `<section class="col" data-drop="tasks:status:${k}"><div class="col-head"><span class="name ${TASK_COLOR[k]}">${name} <span>${items.length}</span></span></div><div class="col-list">${body}${items.length > shown.length ? `<div class="more">+ ${items.length - shown.length} concluídas antes</div>` : ''}</div></section>`;
    }).join('');
    const ownerChips = ['todos', ...state.team].map(o => `<button class="chip" data-owner="${esc(o)}" aria-pressed="${state.taskOwner === o}">${o === 'todos' ? 'Todos' : esc(o)}</button>`).join('');
    const quick = [['hoje', 'Hoje'], ['atrasadas', 'Atrasadas'], ['alta', '🔥 Alta prioridade']].map(([k, n]) => `<button class="chip" data-quick="${k}" aria-pressed="${state.taskQuick === k}">${n}</button>`).join('');
    const projOpts = `<option value="">Todos os projetos</option>` + state.projects.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}" ${state.taskProject === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
    return `
      <div class="view-head"><div><h1 class="h-xl">Tarefas</h1><p>Arraste os cartões entre as colunas. O ▶ liga o cronômetro e registra as horas no projeto.</p></div><button class="pill-btn solid" data-new="tasks">+ Nova tarefa</button></div>
      <div class="filters">${ownerChips}<span class="sep"></span>${quick}<select id="f-task-project" aria-label="Filtrar por projeto">${projOpts}</select></div>
      <div class="board" style="--cols:3">${cols}</div>`;
  }

  function viewAgenda() {
    const [y, m] = state.agendaMonth.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const todayK = ymd(new Date());
    const cells = Array.from({ length: 42 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
    const cut = cells.findIndex((d, i) => i % 7 === 0 && i > 27 && d.getMonth() !== m - 1);
    const shown = cut > 0 ? cells.slice(0, cut) : cells;
    const grid = shown.map(d => {
      const k = ymd(d); const it = itemsOn(k);
      return `<button class="cell ${d.getMonth() !== m - 1 ? 'out' : ''} ${k === todayK ? 'today' : ''} ${k === state.agendaDate ? 'sel' : ''}" data-day="${k}" aria-label="${esc(longDate(k))}${it.length ? ', ' + it.length + ' itens' : ''}">
        <span class="n">${d.getDate()}</span>
        ${it.slice(0, 3).map(x => `<span class="ev" style="background:${KIND_COLOR[x.kind]}">${x.time ? esc(x.time) + ' ' : ''}${esc(x.title)}</span>`).join('')}
        ${it.length > 3 ? `<span class="ev-more">+${it.length - 3}</span>` : ''}
        <span class="dots">${it.slice(0, 4).map(x => `<i style="background:${KIND_COLOR[x.kind]}"></i>`).join('')}</span>
      </button>`;
    }).join('');
    const sel = itemsOn(state.agendaDate);
    const list = sel.length ? `<div class="list">${sel.map(x => `
      <div class="row" data-open="${x.kind}:${x.id}">
        <span class="row-ic" style="background:${KIND_COLOR[x.kind]}">${x.time ? esc(x.time) : '•'}</span>
        <div class="row-main"><div class="row-title">${esc(x.title)}</div><div class="row-sub">${esc(KIND_NAME[x.kind])}${x.end ? ' até ' + esc(x.end) : ''}${x.sub ? ' · ' + esc(x.sub) : ''}</div></div>
        ${chev}
      </div>`).join('')}</div>` : `<div class="empty">Nada marcado neste dia.</div>`;
    return `
      <div class="view-head"><div><h1 class="h-xl">Agenda</h1><p>Compromissos da equipe, com prazos de tarefas, entregas e retornos de clientes no mesmo lugar.</p></div><button class="pill-btn solid" data-new="events">+ Novo compromisso</button></div>
      <div class="cal-wrap">
        <section class="cal">
          <div class="cal-head"><h2>${MONTHS[m - 1]} ${y}</h2>
            <button class="pill-btn small" data-month="today">Hoje</button>
            <button class="ic-btn sm" data-month="-1" aria-label="Mês anterior">${ICON_L}</button>
            <button class="ic-btn sm" data-month="1" aria-label="Próximo mês">${ICON_R}</button></div>
          <div class="wk">${WD.map(w => `<span>${w}</span>`).join('')}</div>
          <div class="grid-m">${grid}</div>
          <div class="legend"><span><i style="background:var(--pink)"></i>Compromisso</span><span><i style="background:var(--yellow)"></i>Tarefa</span><span><i style="background:var(--peri)"></i>Entrega</span><span><i style="background:var(--lav)"></i>Retorno</span></div>
        </section>
        <section class="cal dayp">
          <div class="cal-head"><h2 class="h-sec">${esc(longDate(state.agendaDate))}</h2></div>
          ${list}
          <div style="margin-top:14px"><button class="pill-btn solid big" data-new="events">Marcar neste dia</button></div>
        </section>
      </div>`;
  }

  // Linha do tempo (Gantt) de 10 semanas, começando na semana passada
  function gantt(list) {
    const rs = weekStart(new Date()); rs.setDate(rs.getDate() - 7);
    const DAYS = 70;
    const pos = d => (d - rs) / 86400000 / DAYS * 100;
    const head = Array.from({ length: 10 }, (_, i) => { const d = new Date(rs); d.setDate(rs.getDate() + i * 7); return `<span style="left:${i * 10}%">${pad(d.getDate())}/${pad(d.getMonth() + 1)}</span>`; }).join('');
    const tpos = pos(new Date());
    const rows = list.map(p => {
      const s = parseDate(p.start) || parseDate(localDay(p.createdAt)) || new Date();
      let e = parseDate(p.due); if (!e || e < s) { e = new Date(s); e.setDate(s.getDate() + 7); }
      const e2 = new Date(e); e2.setDate(e.getDate() + 1);
      const l = Math.max(0, pos(s)), r = Math.min(100, pos(e2));
      const bar = r <= 0 || l >= 100 ? `<span class="g-bar" style="left:${l >= 100 ? 92 : 0}%;width:8%;background:var(--surface-3);color:var(--muted)" data-open="projects:${p.id}">${l >= 100 ? 'depois →' : '← antes'}</span>`
        : `<span class="g-bar" style="left:${l}%;width:${Math.max(1.5, r - l)}%;background:${PROJECT_BAR[p.status] || 'var(--lav)'}${p.status === 'pausado' ? ';color:var(--ink)' : ''}" data-open="projects:${p.id}" title="${esc(p.name)}">${esc(p.name)}</span>`;
      return `<div class="g-row"><div class="g-name" data-open="projects:${p.id}"><span>${esc(p.name)}</span><small>${esc(label(PROJECT_STATUS, p.status))}${p.due ? ' · entrega ' + esc(dueText(p.due)) : ''}</small></div><div class="g-track">${bar}${tpos >= 0 && tpos <= 100 ? `<span class="g-today" style="left:${tpos}%"></span>` : ''}</div></div>`;
    }).join('');
    return `<div class="gantt-wrap"><div class="gantt"><div class="g-row head"><div></div><div class="g-head">${head}</div></div>${rows}</div></div>`;
  }

  function viewProjetos() {
    let list = state.projects.slice();
    if (state.projFilter === 'ativos') list = list.filter(p => p.status !== 'entregue');
    if (state.projFilter === 'entregues') list = list.filter(p => p.status === 'entregue');
    const order = PROJECT_STATUS.map(([k]) => k);
    list.sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status) || byDue(a, b));
    const chips = [['ativos', 'Ativos'], ['entregues', 'Entregues'], ['todos', 'Todos']].map(([k, n]) => `<button class="chip" data-pf="${k}" aria-pressed="${state.projFilter === k}">${n}</button>`).join('');
    const modes = [['cards', 'Cartões'], ['timeline', 'Linha do tempo']].map(([k, n]) => `<button class="chip" data-pmode="${k}" aria-pressed="${state.projMode === k}">${n}</button>`).join('');
    const cards = list.map(p => {
      const ts = state.tasks.filter(t => t.projectId === p.id); const dn = ts.filter(t => t.status === 'done').length;
      const pct = ts.length ? Math.round(dn / ts.length * 100) : 0;
      const mins = projectMinutes(p.id);
      return `<div class="tile pcard ${PROJECT_TILE[p.status] || 'g-lav'}" data-open="projects:${p.id}" tabindex="0" role="button">
        <span class="ic-btn sm light arrow">${ICON_UP}</span>
        <span class="d">${esc(p.client || 'Sem cliente')}${p.due ? ' · entrega ' + esc(dueText(p.due)) : ''}</span>
        <span class="tg">${esc(label(PROJECT_STATUS, p.status) || '—')}${p.service ? ' · ' + esc(p.service) : ''}</span>
        <span class="t">${esc(p.name)}</span>
        <span class="tbar"><i style="width:${pct}%"></i></span>
        <span class="foot">${avatar(p.owner)}<span>${dn}/${ts.length} tarefas${mins ? ' · ⏱ ' + fmtH(mins) : ''}</span>${p.value ? `<span class="money">${brl(p.value)}</span>` : ''}</span>
      </div>`;
    }).join('');
    const total = list.reduce((s, p) => s + (Number(p.value) || 0), 0);
    const content = !list.length ? `<div class="empty">${state.projects.length ? 'Nenhum projeto neste filtro.' : 'Nenhum projeto ainda. Use <b>+ Novo projeto</b> para cadastrar cliente, serviço, prazo e valor.'}</div>`
      : state.projMode === 'timeline' ? gantt(list) : `<div class="pgrid">${cards}</div>`;
    return `
      <div class="view-head"><div><h1 class="h-xl">Projetos</h1><p>${list.length} projeto${list.length === 1 ? '' : 's'} · <span class="money">${brl(total)}</span></p></div><button class="pill-btn solid" data-new="projects">+ Novo projeto</button></div>
      <div class="filters">${chips}<div class="right">${modes}</div></div>
      ${content}`;
  }

  function contactCard(c) {
    const closed = ['fechado', 'perdido'].includes(c.stage);
    const links = [waLink(c.whatsapp), igLink(c.instagram)].filter(Boolean).join(' ');
    return `<div class="card" draggable="true" data-drag="contacts:${c.id}" data-open="contacts:${c.id}" tabindex="0" role="button">
      <div class="card-top">${c.source ? `<span class="tag">${esc(c.source)}</span>` : ''}${!closed ? heatMeter(c.heat) : ''}</div>
      <div><div class="card-title">${esc(c.name)}</div>${c.company ? `<div class="card-sub">${esc(c.company)}</div>` : ''}</div>
      ${c.nextAction && !closed ? `<div class="card-sub">→ ${esc(c.nextAction)} ${due(c.nextDate)}</div>` : ''}
      <div class="card-meta">${c.value ? `<span class="money">${brl(c.value)}</span>` : ''}${links ? `<span class="push">${links}</span>` : ''}</div>
    </div>`;
  }

  function viewClientes() {
    const key = ym(new Date()); const prevKey = shiftMonth(key, -1);
    const pl = pipeline();
    const closedNow = money(key).closed.length, closedPrev = money(prevKey).closed.length;
    const newNow = state.contacts.filter(c => inMonth(c.createdAt, key)).length, newPrev = state.contacts.filter(c => inMonth(c.createdAt, prevKey)).length;
    const hotN = pl.open.filter(c => c.heat === 'quente').length;
    const kpis = `<div class="kpis">
      <div class="kpi"><div class="v">${pl.open.length}</div><span class="l">no funil · ${brl(pl.total)}</span></div>
      <div class="kpi"><div class="v">${hotN}</div><span class="l">🔥 quentes</span></div>
      <div class="kpi"><div class="v">${newNow} ${deltaBadge(newNow, newPrev)}</div><span class="l">novos no mês</span></div>
      <div class="kpi"><div class="v">${closedNow} ${deltaBadge(closedNow, closedPrev)}</div><span class="l">fechados no mês</span></div>
    </div>`;
    const q = state.crmQuery.trim().toLowerCase();
    let list = state.contacts.slice();
    if (state.crmHeat) list = list.filter(c => c.heat === state.crmHeat);
    if (q) list = list.filter(c => [c.name, c.company, c.instagram, c.whatsapp].some(v => String(v || '').toLowerCase().includes(q)));
    const cols = STAGES.map(([k, name]) => {
      const items = list.filter(c => (c.stage || 'contato') === k).sort((a, b) => (HEAT_DOTS[b.heat] || 0) - (HEAT_DOTS[a.heat] || 0) || byDue(a, b));
      const sum = items.reduce((s, c) => s + (Number(c.value) || 0), 0);
      const body = items.length ? items.map(contactCard).join('') : `<div class="col-empty">${k === 'contato' ? 'Novos contatos entram aqui' : 'Arraste um contato para cá'}</div>`;
      return `<section class="col" data-drop="contacts:stage:${k}"><div class="col-head"><span class="name ${STAGE_COLOR[k]}">${name} <span>${items.length}</span></span><span class="sum">${sum ? brl(sum) : ''}</span></div><div class="col-list">${body}</div></section>`;
    }).join('');
    const heatChips = [['', 'Todos'], ...HEAT].map(([k, n]) => `<button class="chip" data-heat="${k}" aria-pressed="${state.crmHeat === k}">${n}</button>`).join('');
    return `
      <div class="view-head"><div><h1 class="h-xl">Clientes</h1><p>Do primeiro “oi” ao contrato fechado. Arraste o contato conforme a conversa avança.</p></div><button class="pill-btn solid" data-new="contacts">+ Novo contato</button></div>
      <section class="panel" style="margin-bottom:18px">${kpis}</section>
      <div class="filters">${heatChips}<input id="f-crm-search" data-keep type="search" placeholder="Buscar nome, marca, @…" value="${esc(state.crmQuery)}" autocomplete="off"></div>
      <div class="board" style="--cols:4">${cols}</div>`;
  }

  // ---------- Finanças ----------
  function viewFinancas() {
    const key = state.finMonth; const year = Number(key.slice(0, 4));
    const m = money(key), prev = money(shiftMonth(key, -1)), pl = pipeline(), yt = yearTotals(year);
    const margin = m.revenue ? Math.round(m.profit / m.revenue * 100) : null;
    const kcards = `
      <div class="kgrid">
        <div class="kcard hero"><div class="k">Lucro de ${MONTHS[Number(key.slice(5, 7)) - 1]}</div><div class="v">${brl(m.profit)}</div><div class="s">${margin !== null ? `margem de ${margin}%` : 'sem receita no mês'} ${deltaBadge(m.profit, prev.profit)}</div></div>
        <div class="kcard"><div class="k"><i style="background:var(--pink)"></i>Receita</div><div class="v">${brl(m.revenue)}</div><div class="s">${brl(m.crm)} do funil${m.extra ? ' · ' + brl(m.extra) + ' fora' : ''} ${deltaBadge(m.revenue, prev.revenue)}</div></div>
        <div class="kcard"><div class="k"><i style="background:var(--lav)"></i>Despesas</div><div class="v">${brl(m.expense)}</div><div class="s">${m.fin.filter(f => f.type === 'despesa').length} lançamentos ${deltaBadge(m.expense, prev.expense)}</div></div>
        <div class="kcard"><div class="k"><i style="background:var(--yellow)"></i>Em negociação</div><div class="v">${brl(pl.total)}</div><div class="s">provável ${brl(pl.likely)} · ${pl.open.length} contatos</div></div>
      </div>`;
    const cats = {};
    m.fin.filter(f => f.type === 'despesa').forEach(f => { const c = f.category || 'Outros'; cats[c] = (cats[c] || 0) + (Number(f.amount) || 0); });
    const catArr = Object.entries(cats).sort((a, b) => b[1] - a[1]); const catMax = Math.max(1, ...catArr.map(c => c[1]));
    const catHtml = catArr.length ? `<div class="cat">${catArr.map(([c, v]) => `<div class="cr"><span>${esc(c)}</span><b>${brl(v)}</b><span class="hb"><i style="width:${v / catMax * 100}%"></i></span></div>`).join('')}</div>` : '<div class="empty">Nenhuma despesa lançada neste mês.</div>';
    let fl = m.fin.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (state.finType) fl = fl.filter(f => f.type === state.finType);
    const crmRows = !state.finType || state.finType === 'receita' ? m.closed.map(c => `<div class="row" data-open="contacts:${c.id}"><span class="row-ic" style="background:var(--pink)">${shortDate(localDay(c.closedAt || c.updatedAt))}</span><div class="row-main"><div class="row-title">${esc(c.company || c.name)}</div><div class="row-sub">Contrato fechado no funil</div></div><span class="amt-in">+ ${brl(c.value)}</span></div>`).join('') : '';
    const finRows = fl.map(f => `<div class="row" data-open="finance:${f.id}"><span class="row-ic" style="background:${f.type === 'despesa' ? 'var(--lav)' : f.type === 'investimento' ? 'var(--peri)' : 'var(--pink)'}">${shortDate(f.date)}</span><div class="row-main"><div class="row-title">${esc(f.title)}</div><div class="row-sub">${esc(label(FIN_TYPES, f.type))}${f.category ? ' · ' + esc(f.category) : ''}${f.projectId ? ' · ' + esc(projectName(f.projectId)) : ''}</div></div><span class="${f.type === 'despesa' ? 'amt-out' : f.type === 'investimento' ? 'amt-inv' : 'amt-in'}">${f.type === 'receita' ? '+' : '−'} ${brl(f.amount)}</span></div>`).join('');
    const typeChips = [['', 'Tudo'], ['receita', 'Receitas'], ['despesa', 'Despesas'], ['investimento', 'Investimentos']].map(([k, n]) => `<button class="chip" data-fintype="${k}" aria-pressed="${state.finType === k}">${n}</button>`).join('');
    const deals = pl.open.slice().sort((a, b) => (Number(b.value) || 0) - (Number(a.value) || 0)).slice(0, 6);
    const dealsHtml = deals.length ? `<div class="list">${deals.map(c => `<div class="row" data-open="contacts:${c.id}"><span class="row-ic" style="background:${c.stage === 'proposta' ? 'var(--yellow)' : 'var(--lav)'}">${Math.round(pl.prob(c) * 100)}%</span><div class="row-main"><div class="row-title">${esc(c.company || c.name)}</div><div class="row-sub">${esc(label(STAGES, c.stage))}${c.heat ? ' · ' + esc(label(HEAT, c.heat)) : ''}</div></div><span class="money">${c.value ? brl(c.value) : '—'}</span></div>`).join('')}</div>` : '<div class="empty">Nenhuma negociação aberta. Os contatos em Contato e Proposta aparecem aqui.</div>';

    const curKey = ym(new Date());
    const monthsHtml = Array.from({ length: 12 }, (_, i) => {
      const k = year + '-' + pad(i + 1); const mm = money(k); const future = k > curKey;
      const n = mm.fin.length + mm.closed.length;
      return `<button class="mcard ${future ? 'future' : ''} ${k === key ? 'sel' : ''}" data-finmonth="${k}" aria-label="${cap(MONTHS[i])}: lucro ${brl(mm.profit)}">
        ${landscape(i, year)}
        <span class="mchip">${future ? '<span>em breve</span>' : `<span>${brlShort(mm.profit)} de lucro</span><span>${n} lançamento${n === 1 ? '' : 's'}</span>`}</span>
        <span class="mdots">${ICON_DOTS}</span>
        <span class="mname" style="--len:${MONTHS[i].length}">${cap(MONTHS[i])}</span>
      </button>`;
    }).join('');

    return `
      <div class="view-head"><div><h1 class="h-xl">Finanças</h1><p>Receita do funil e de fora dele, despesas, investimentos e o que ainda está em negociação.</p></div>
        <div class="acts"><span class="mswitch"><button class="ic-btn" data-finshift="-1" aria-label="Mês anterior">${ICON_L}</button><b>${esc(monthName(key))}</b><button class="ic-btn" data-finshift="1" aria-label="Próximo mês">${ICON_R}</button></span>
        <button class="pill-btn solid" data-new="finance">+ Lançamento</button></div></div>
      ${kcards}
      <div class="cols2">
        <section class="panel chart-card"><div class="panel-head" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 class="h-sec">${year}</h2><span style="color:var(--muted);font-size:13px">Lucro no ano <b style="color:var(--ink)">${brl(yt.profit)}</b> · investido ${brl(yt.invest)}</span></div>
          ${yearChart(year)}
          <div class="legend"><span><i style="background:var(--pink)"></i>Receita</span><span><i style="background:var(--lav)"></i>Despesas</span><span><i style="background:var(--yellow)"></i>Lucro</span><span>Toque num mês para abrir</span></div></section>
        <section class="panel"><h2 class="h-sec" style="margin-bottom:6px">Para onde foi o dinheiro</h2>${catHtml}
          <div class="kcard" style="margin-top:14px;background:var(--surface-2);box-shadow:none;border:0"><div class="k"><i style="background:var(--peri)"></i>Investimentos no mês</div><div class="v">${brl(m.invest)}</div><div class="s">${brl(yt.invest)} no ano</div></div></section>
      </div>
      <div class="cols2">
        <div><div class="sec-head"><h2 class="h-sec">Lançamentos</h2></div>
          <div class="filters">${typeChips}</div>
          ${crmRows || finRows ? `<div class="list">${crmRows}${finRows}</div>` : '<div class="empty">Nada lançado neste mês. Use <b>+ Lançamento</b> para registrar despesas, investimentos ou receitas de fora do funil.</div>'}</div>
        <div><div class="sec-head"><h2 class="h-sec">Em negociação</h2><button class="pill-btn small" data-go="clientes">Funil</button></div>${dealsHtml}</div>
      </div>
      <div class="sec-head"><h2 class="h-sec">Meses de ${year}</h2></div>
      <div class="months">${monthsHtml}</div>`;
  }

  // ---------- Metas em linha do tempo ----------
  function viewMetas() {
    const year = state.metaYear; const curKey = ym(new Date());
    const yt = yearTotals(year);
    const rows = [];
    for (let i = 0; i < 12; i++) {
      const key = year + '-' + pad(i + 1); const s = goalStatsFor(key);
      const has = s.revenueT || s.dealsT || s.leadsT;
      const isCur = key === curKey, future = key > curKey;
      const main = s.revenueT ? s.revenueP : s.dealsT ? s.dealsP : s.leadsP;
      const doneM = has && !future && main >= 100;
      const bar = (lbl, v, t, p, isMoney) => t ? `<div class="gbar">${lbl}: <b>${isMoney ? brlShort(v) : v}</b> de ${isMoney ? brlShort(t) : t}<div class="hb"><i class="${p >= 100 ? 'full' : ''}" style="width:${Math.min(100, p)}%"></i></div></div>` : '';
      rows.push(`<div class="mrow ${isCur ? 'cur' : ''} ${future ? 'future' : ''} ${doneM ? 'done' : ''}">
        <div class="big">${MONTHS[i].slice(0, 3)}</div>
        <div class="node"><i>${doneM ? '✓' : isCur ? '●' : i + 1}</i></div>
        <div class="gcard" data-goals="${key}" role="button" tabindex="0">
          <div class="gt"><b>${MONTHS[i]}</b><span>${has ? (future ? 'meta definida' : main + '% da meta principal') : (future ? 'sem meta ainda' : 'sem meta · toque para definir')}</span></div>
          ${has ? `<div class="gbars">${bar('Faturamento', s.revenue, s.revenueT, s.revenueP, true)}${bar('Contratos', s.deals, s.dealsT, s.dealsP)}${bar('Novos contatos', s.leads, s.leadsT, s.leadsP)}</div>` : ''}
        </div></div>`);
      state.milestones.filter(m => String(m.date || '').slice(0, 7) === key).sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(m => {
        const v = msValue(m), t = Number(m.target) || 0, p = t ? Math.round(v / t * 100) : 0;
        const fmt = x => msMoney(m) ? brl(x) : x;
        rows.push(`<div class="mrow ms ${p >= 100 ? 'done' : ''}"><div class="big" style="font-size:20px;-webkit-text-stroke:0;color:var(--muted)">${shortDate(m.date)}</div><div class="node"><i>${p >= 100 ? '✓' : '★'}</i></div>
          <div class="gcard" data-open="milestones:${m.id}" role="button" tabindex="0"><div class="gt"><b>${esc(m.title)}</b><span>${p}% · ${esc(label(MS_METRICS, m.metric) || '')}</span></div>
          <div class="gbar"><b>${fmt(v)}</b> de ${fmt(t)}<div class="hb"><i class="${p >= 100 ? 'full' : ''}" style="width:${Math.min(100, p)}%"></i></div></div></div></div>`);
      });
    }
    return `
      <div class="yearhead">
        <div class="y">${year}</div>
        <div class="yb">
          <span class="mswitch"><button class="ic-btn" data-metayear="-1" aria-label="Ano anterior">${ICON_L}</button><b>Metas do ano</b><button class="ic-btn" data-metayear="1" aria-label="Próximo ano">${ICON_R}</button></span>
          <span style="color:var(--muted);font-size:14px">Faturado ${brl(yt.revenue)} · lucro ${brl(yt.profit)} · ${yt.deals} contratos</span>
          <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="pill-btn solid" data-new="milestones">+ Novo marco</button><button class="pill-btn" data-goals="${curKey}">Meta deste mês</button></span>
        </div>
      </div>
      <div class="mtl">${rows.join('')}</div>`;
  }

  const TITLES = { tasks: ['Nova tarefa', 'Editar tarefa'], events: ['Novo compromisso', 'Editar compromisso'], projects: ['Novo projeto', 'Editar projeto'], contacts: ['Novo contato', 'Editar contato'], finance: ['Novo lançamento', 'Editar lançamento'], milestones: ['Novo marco', 'Editar marco'], notes: ['Novo recado', 'Editar recado'] };

  function inputHtml(f, val) {
    const id = 'f-' + f.n; const v = val ?? f.def ?? '';
    if (f.t === 'select') return `<select id="${id}" name="${f.n}">${f.o.map(([k, l]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    if (f.t === 'textarea') return `<textarea id="${id}" name="${f.n}">${esc(v)}</textarea>`;
    return `<input id="${id}" name="${f.n}" type="${f.t}" value="${esc(v)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} ${f.list ? `list="${f.list}"` : ''} ${f.t === 'number' ? 'min="0" step="0.01" inputmode="decimal"' : ''} autocomplete="off">`;
  }

  let modalCtx = null;
  function modalShell(id, title, body, foot) {
    $('#modal-root').innerHTML = `
      <div class="overlay">

          <div class="modal-head"><h2 id="${id}-t">${title}</h2><button type="button" class="ic-btn sm" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
          ${body}
          ${foot ?? ''}

      </div>`;
  }

  function openForm(kind, id, preset) {
    const item = id ? state[kind].find(x => x.id === id) : null;
    if (id && !item) return;
    const data = { ...(preset || {}), ...(item || {}) };
    modalCtx = { kind, id: item ? item.id : null };
    let extra = '';
    if (kind === 'projects' && item) {
      const ts = state.tasks.filter(t => t.projectId === item.id).sort((a, b) => (a.status === 'done') - (b.status === 'done') || byDue(a, b));
      const mins = projectMinutes(item.id);
      const costs = state.finance.filter(f => f.projectId === item.id && f.type === 'despesa').reduce((s, f) => s + (Number(f.amount) || 0), 0);
      extra = `<div class="sub-sec"><h3>Tarefas deste projeto${mins ? ` · ⏱ ${fmtH(mins)}` : ''}${costs ? ` · custos ${brl(costs)}` : ''}</h3>${ts.length ? `<div class="list">${ts.map(t => `
        <div class="row" data-open="tasks:${t.id}"><button type="button" class="check ${t.status === 'done' ? 'on' : ''}" data-toggle="${t.id}" aria-label="Alternar feito"></button>
        <div class="row-main"><div class="row-title" style="${t.status === 'done' ? 'color:var(--muted);text-decoration:line-through' : ''}">${esc(t.title)}</div><div class="row-sub">${esc(t.owner || 'Sem responsável')}</div></div>${due(t.due, t.status === 'done')}${chev}</div>`).join('')}</div>`
        : '<div class="empty">Nenhuma tarefa ligada a este projeto.</div>'}
        <button type="button" class="pill-btn small" data-newtask="${item.id}" style="margin-top:10px">+ Tarefa neste projeto</button></div>`;
    }
    if (kind === 'tasks' && item) {
      const logs = state.timelogs.filter(l => l.taskId === item.id);
      const run = state.timers.find(x => x.taskId === item.id);
      const logRows = logs.sort((a, b) => (b.start || '').localeCompare(a.start || '')).map(l => `<div class="row" style="cursor:default"><div class="row-main"><div class="row-title">${fmtH(l.minutes)} · ${esc(l.who)}</div><div class="row-sub">${esc(longDate(localDay(l.start)))}</div></div><button type="button" class="mini" data-dellog="${l.id}">Apagar</button></div>`).join('');
      if (item.status !== 'done' || logs.length) extra = `<div class="sub-sec"><h3>Horas nesta tarefa: ${fmtH(logsMinutes(logs))}</h3>
        ${logRows ? `<div class="list" style="margin-bottom:10px">${logRows}</div>` : ''}
        ${item.status !== 'done' ? (run ? (run.who === state.me ? `<button type="button" class="pill-btn small" data-stop>■ Parar cronômetro</button>` : `<span class="tag">⏱ ${esc(run.who)} está com o cronômetro ligado</span>`) : `<button type="button" class="pill-btn small" data-timer="${item.id}">▶ Ligar cronômetro</button>`) : ''}</div>`;
    }
    if (kind === 'milestones' && item) extra = `<div class="sub-sec"><h3>Agora: ${msMoney(item) ? brl(msValue(item)) : msValue(item)} de ${msMoney(item) ? brl(item.target) : item.target}</h3></div>`;
    const dl = kind === 'projects' ? `<datalist id="dl-contacts">${state.contacts.map(c => `<option value="${esc(c.company || c.name)}">`).join('')}</datalist>` : '';
    modalShell('modal-form', TITLES[kind][item ? 1 : 0],
      `<div class="fields">${fieldsFor(kind).map(f => `<div class="field ${f.full ? 'full' : ''}"><label for="f-${f.n}">${f.l}${f.req ? ' *' : ''}</label>${inputHtml(f, data[f.n])}</div>`).join('')}</div>${dl}${extra}`,
      `<div class="modal-foot">${item ? '<button type="button" class="btn-del" id="btn-del">Excluir</button>' : ''}<span class="spacer"></span><button type="button" class="pill-btn" data-close>Cancelar</button><button type="submit" class="pill-btn solid">${item ? 'Salvar' : 'Criar'}</button></div>`);
    const first = $('#modal-form input, #modal-form select'); if (first && !item) first.focus();
  }
  function closeModal() { $('#modal-root').innerHTML = ''; modalCtx = null; }

  // Datas de fechamento e conclusão usadas pela meta e pela produtividade
  function closedAtFor(prev, stage) {
    if (stage !== 'fechado') return null;
    return prev && prev.stage === 'fechado' && prev.closedAt ? prev.closedAt : new Date().toISOString();
  }
  function doneAtFor(prev, status) {
    if (status !== 'done') return null;
    return prev && prev.status === 'done' && prev.doneAt ? prev.doneAt : new Date().toISOString();
  }

  async function submitForm(form) {
    const { kind, id } = modalCtx;
    const out = {}; let bad = null;
    fieldsFor(kind).forEach(f => {
      const el = form.elements[f.n]; let v = el.value.trim();
      if (f.t === 'number') v = v === '' ? null : Math.max(0, Number(v.replace(',', '.')) || 0);
      out[f.n] = v;
      el.closest('.field').classList.toggle('invalid', !!(f.req && !v));
      if (f.req && !v && !bad) bad = el;
    });
    if (bad) { bad.focus(); toast('Preencha os campos marcados com *.', true); return; }
    const prev = id ? state[kind].find(x => x.id === id) : null;
    const now = new Date().toISOString();
    // Mantém os campos que o formulário não mostra (autor do recado, datas de fechamento etc.)
    const body = { ...(prev || {}), ...out, createdAt: prev && prev.createdAt ? prev.createdAt : now, updatedAt: now };
    delete body.id;
    if (kind === 'notes') { if (prev) body.editedAt = now; else body.who = state.me; }
    if (kind === 'contacts') body.closedAt = closedAtFor(prev, out.stage);
    if (kind === 'tasks') body.doneAt = doneAtFor(prev, out.status);
    if (kind === 'events' && out.date) { state.agendaDate = out.date; state.agendaMonth = out.date.slice(0, 7); }
    if (kind === 'finance' && out.date) state.finMonth = out.date.slice(0, 7);
    closeModal();
    await write(() => store.save(kind, id || uid(), body), id ? 'Salvo' : CREATED[kind]);
  }

      `<div class="modal-foot">${u && can ? `<button type="button" class="btn-del" id="btn-photo-reset">${P.reset}</button>` : ''}<span class="spacer"></span>
        ${can ? `<label class="pill-btn solid file-btn">Escolher foto<input type="file" id="f-photo" accept="image/png,image/jpeg,image/webp"></label>` : '<span class="modal-note" style="padding:0">Só quem é Editor da página pode trocar a foto.</span>'}</div>`);
  }
  async function uploadPhoto(target, file) {
    if (!file) return;
    const P = PHOTO[target];
    if (file.size > 20 * 1024 * 1024) return toast('A foto passa de 20 MB. Escolha uma menor.', true);
    if (store.mode === 'local') {
      const r = new FileReader();
      r.onload = () => { try { localStorage.setItem(P.local, r.result); toast(P.done + ' neste navegador'); } catch (e) { toast('A foto é grande demais para guardar no navegador.', true); } closeModal(); render(); };
      r.readAsDataURL(file); return;
    }
    const a = await getAssets(); if (!a) return toast('Só quem é Editor da página pode trocar a foto.', true);
    toast('Enviando a foto…');
    try {
      const res = await a.upload(file);
      closeModal();
      await write(() => store.saveDoc('config/look', { ...(state.look || {}), [P.field]: res.id, updatedAt: new Date().toISOString() }), P.done + ' para todos');
    } catch (e) {
      const c = e && e.code;
      toast(c === 'too_large' ? 'A foto é grande demais.' : c === 'unsupported_type' ? 'Use uma foto JPG, PNG ou WEBP.' : 'Não consegui enviar a foto. Tente de novo.', true);
    }
  }
  function resetPhoto(target) {
