  function runSearch(q) {
    q = q.trim().toLowerCase();
    const box = $('#results'); if (!box) return;
    if (q.length < 2) { box.innerHTML = '<div class="empty">Digite pelo menos 2 letras.</div>'; return; }
    const hit = (o, keys) => keys.some(k => String(o[k] || '').toLowerCase().includes(q));
    const res = [
      ...state.tasks.filter(t => hit(t, ['title', 'notes'])).map(t => ({ k: 'tasks', id: t.id, t: t.title, s: 'Tarefa · ' + label(TASK_STATUS, t.status) })),
      ...state.events.filter(e => hit(e, ['title', 'place', 'notes'])).map(e => ({ k: 'events', id: e.id, t: e.title, s: 'Compromisso · ' + longDate(e.date) })),
      ...state.projects.filter(p => hit(p, ['name', 'client', 'notes'])).map(p => ({ k: 'projects', id: p.id, t: p.name, s: 'Projeto · ' + label(PROJECT_STATUS, p.status) })),
      ...state.contacts.filter(c => hit(c, ['name', 'company', 'instagram', 'whatsapp', 'notes'])).map(c => ({ k: 'contacts', id: c.id, t: c.name, s: 'Cliente · ' + label(STAGES, c.stage) })),
      ...state.finance.filter(f => hit(f, ['title', 'category', 'notes'])).map(f => ({ k: 'finance', id: f.id, t: f.title, s: label(FIN_TYPES, f.type) + ' · ' + brl(f.amount) })),
      ...state.milestones.filter(m => hit(m, ['title', 'notes'])).map(m => ({ k: 'milestones', id: m.id, t: m.title, s: 'Marco · ' + shortDate(m.date) }))
    ].slice(0, 30);
    box.innerHTML = res.length ? `<div class="list">${res.map(r => `<div class="row" data-open="${r.k}:${r.id}"><span class="row-ic" style="background:${KIND_COLOR[r.k]}">${esc(r.t.charAt(0).toUpperCase())}</span><div class="row-main"><div class="row-title">${esc(r.t)}</div><div class="row-sub">${esc(r.s)}</div></div>${chev}</div>`).join('')}</div>` : '<div class="empty">Nada encontrado.</div>';
  }

  // ---------- Dados de exemplo (só na versão de demonstração, fora do Claude) ----------
  function seedDemo() {
    if (store.mode !== 'local') return;
    const n = new Date(); const iso = n.toISOString(); const D = o => { const x = new Date(); x.setDate(x.getDate() + o); return ymd(x); };
    const ago = m => new Date(Date.now() - m * 60000).toISOString(); const prevM = new Date(n.getFullYear(), n.getMonth() - 1, 12).toISOString();
    const [a, b] = [state.team[0] || 'André', state.team[1] || state.team[0] || 'Danyelle'];
    const demo = {
      tasks: [
        { id: 'ex-t1', title: 'Artes do carrossel de lançamento', status: 'todo', due: D(0), priority: 'alta', owner: b, projectId: 'ex-p2' },
        { id: 'ex-t2', title: 'Layout da página inicial', status: 'doing', due: D(2), priority: 'media', owner: a, projectId: 'ex-p1' },
        { id: 'ex-t3', title: 'Roteiro dos reels da semana', status: 'todo', due: D(-1), priority: 'media', owner: b },
        { id: 'ex-t4', title: 'Briefing com o cliente', status: 'done', doneAt: ago(60 * 26), owner: a, projectId: 'ex-p1' }
      ],
      events: [
        { id: 'ex-e1', title: 'Reunião de alinhamento', date: D(0), start: '10:00', end: '11:00', type: 'Reunião', owner: a },
        { id: 'ex-e2', title: 'Gravação de conteúdo', date: D(0), start: '15:00', end: '17:00', type: 'Gravação', owner: b },
        { id: 'ex-e3', title: 'Entrega do site', date: D(5), start: '09:00', type: 'Entrega' }
      ],
      projects: [
        { id: 'ex-p1', name: 'Site institucional (exemplo)', client: 'Cliente Exemplo', service: 'Site', status: 'producao', owner: a, start: D(-6), due: D(9), value: 6500 },
        { id: 'ex-p2', name: 'Redes sociais (exemplo)', client: 'Marca Exemplo', service: 'Redes sociais', status: 'briefing', owner: b, start: D(1), due: D(30), value: 2800 }
      ],
      contacts: [
        { id: 'ex-c1', name: 'Cliente Exemplo', company: 'Empresa Exemplo', stage: 'fechado', value: 6500, closedAt: iso, heat: 'quente', source: 'Instagram' },
        { id: 'ex-c2', name: 'Contato quente (exemplo)', company: 'Loja Exemplo', stage: 'proposta', value: 4800, heat: 'quente', nextDate: D(1), nextAction: 'Cobrar retorno da proposta', source: 'Indicação' },
        { id: 'ex-c3', name: 'Contato morno (exemplo)', stage: 'contato', value: 3000, heat: 'morno', nextDate: D(3), nextAction: 'Mandar portfólio', source: 'WhatsApp' },
        { id: 'ex-c4', name: 'Fechado mês passado (exemplo)', stage: 'fechado', value: 9000, closedAt: prevM, createdAt: prevM }
      ],
      finance: [
        { id: 'ex-f1', type: 'despesa', title: 'Assinaturas de ferramentas (exemplo)', amount: 420, date: D(0), category: 'Ferramentas e assinaturas' },
        { id: 'ex-f2', type: 'despesa', title: 'Freela de edição (exemplo)', amount: 900, date: D(0), category: 'Freelancers' },
        { id: 'ex-f3', type: 'investimento', title: 'Lente nova (exemplo)', amount: 2200, date: D(0), category: 'Equipamento' }
      ],
      goals: [{ id: ym(n), revenue: 15000, deals: 4, leads: 10 }],
      milestones: [{ id: 'ex-m1', title: 'Faturar R$ 100 mil no ano (exemplo)', date: n.getFullYear() + '-12-31', target: 100000, metric: 'receita_ano' }],
      notes: [{ id: 'ex-n1', who: a, text: 'Isto é um recado de exemplo. Toque nele para editar ou apagar.', createdAt: ago(45) }]
    };
    Object.entries(demo).forEach(([c, rows]) => {
      const cur = (store.lsRead(c) || []).filter(x => !x.demo);
      const add = rows.map(r => ({ createdAt: iso, updatedAt: iso, ...r, demo: true }));
      store.lsWrite(c, cur.concat(add)); store.listeners[c] && store.listeners[c](cur.concat(add));
    });
    toast('Exemplos carregados. Tudo marcado como exemplo pode ser apagado.');
  }
  function clearDemo() {
    COLLS.forEach(c => { const rows = (store.lsRead(c) || []).filter(x => !x.demo); store.lsWrite(c, rows); store.listeners[c] && store.listeners[c](rows); });
    toast('Exemplos apagados');
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg, err) {
    if (!msg) return;
    $('#toast-root').innerHTML = `<div class="toast ${err ? 'err' : ''}" role="status">${esc(msg)}</div>`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; }, err ? 4500 : 2200);
  }

  // ---------- Eventos ----------
  function go(view) {
    state.view = view;
    try { localStorage.setItem('dna-central:view', view); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  function setField(kind, id, field, value) {
    const item = state[kind].find(x => x.id === id); if (!item || item[field] === value) return;
    const body = { [field]: value, updatedAt: new Date().toISOString() };
    if (kind === 'contacts' && field === 'stage') body.closedAt = closedAtFor(item, value);
    if (kind === 'tasks' && field === 'status') body.doneAt = doneAtFor(item, value);
    write(() => store.patch(kind, id, body));
    if (kind === 'tasks' && value === 'done') { const t = myTimer(); if (t && t.taskId === id) stopTimer(); }
  }
  function newItem(kind) {
    const preset = kind === 'tasks' && state.view === 'tarefas' && state.taskProject ? { projectId: state.taskProject } : null;
    openForm(kind, null, preset);
  }

  document.addEventListener('click', e => {
    const t = e.target;
    const nav = t.closest('.nav button'); if (nav) return go(nav.dataset.view);
    if (t.closest('#btn-theme')) { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('dna-central:theme', theme); } catch (er) {} return applyTheme(); }
    const g = t.closest('[data-go]'); if (g) { if (modalCtx) closeModal(); return go(g.dataset.go); }
    if (t.closest('#btn-new')) return newItem(NEW_KIND[state.view]);
    const nw = t.closest('[data-new]'); if (nw) return newItem(nw.dataset.new);
    if (t.closest('#btn-team')) return openTeam();
    if (t.closest('#btn-search')) return openSearch();
    if (t.closest('#btn-alerts')) return openAlerts();
    if (t.closest('#btn-look')) return openLook('bg');
    if (t.closest('#btn-cover')) return openLook('cover');
    if (t.id === 'btn-photo-reset') return resetPhoto(modalCtx.target);
    if (t.closest('#me-pic')) return openWho();
    const gl = t.closest('[data-goals]'); if (gl) return openGoals(gl.dataset.goals);
    const me = t.closest('[data-me]');
    if (me) {
      const pick = me.dataset.me;
      state.me = modalCtx && modalCtx.kind === 'who' ? pick : (pick === state.me ? '' : pick);
      try { localStorage.setItem('dna-central:me', state.me); } catch (er) {}
      if (modalCtx && modalCtx.kind === 'who') closeModal();
      if (state.me) toast('Pronto, ' + state.me + '. Este aparelho vai lembrar de você.');
      return render();
    }
    const tm = t.closest('[data-timer]'); if (tm) { if (modalCtx) closeModal(); return startTimer(tm.dataset.timer); }
    if (t.closest('[data-stop]')) { if (modalCtx) closeModal(); return stopTimer(); }
    const own = t.closest('[data-owner]'); if (own) { state.taskOwner = own.dataset.owner; return render(); }
    const qk = t.closest('[data-quick]'); if (qk) { state.taskQuick = state.taskQuick === qk.dataset.quick ? '' : qk.dataset.quick; return render(); }
    const pf = t.closest('[data-pf]'); if (pf) { state.projFilter = pf.dataset.pf; return render(); }
    const pm = t.closest('[data-pmode]'); if (pm) { state.projMode = pm.dataset.pmode; return render(); }
    const ht = t.closest('[data-heat]'); if (ht) { state.crmHeat = ht.dataset.heat; return render(); }
    const ft = t.closest('[data-fintype]'); if (ft) { state.finType = ft.dataset.fintype; return render(); }
    const fm = t.closest('[data-finmonth]'); if (fm) { state.finMonth = fm.dataset.finmonth; render(); if (fm.classList.contains('mcard')) window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const fs = t.closest('[data-finshift]'); if (fs) { state.finMonth = shiftMonth(state.finMonth, Number(fs.dataset.finshift)); return render(); }
    const my = t.closest('[data-metayear]'); if (my) { state.metaYear += Number(my.dataset.metayear); return render(); }
    const day = t.closest('[data-day]');
    if (day) {
      state.agendaDate = day.dataset.day; state.agendaMonth = day.dataset.day.slice(0, 7);
      return state.view === 'agenda' ? render() : go('agenda');
    }
    const mo = t.closest('[data-month]');
    if (mo) {
      if (mo.dataset.month === 'today') { const d = new Date(); state.agendaMonth = ym(d); state.agendaDate = ymd(d); }
      else state.agendaMonth = shiftMonth(state.agendaMonth, Number(mo.dataset.month));
      return render();
    }
    const mv = t.closest('[data-move]'); if (mv) { const [k, id, s] = mv.dataset.move.split(':'); return setField(k, id, 'status', s); }
    const tg = t.closest('[data-toggle]');
    if (tg) {
      const task = state.tasks.find(x => x.id === tg.dataset.toggle); if (!task) return;
      const next = task.status === 'done' ? 'todo' : 'done';
      setField('tasks', task.id, 'status', next);
      if (modalCtx && modalCtx.kind === 'projects') tg.classList.toggle('on', next === 'done');
      return;
    }
    const nt = t.closest('[data-newtask]'); if (nt) return openForm('tasks', null, { projectId: nt.dataset.newtask });
    const dl = t.closest('[data-dellog]');
    if (dl) {
      if (!dl.classList.contains('armed')) { dl.classList.add('armed'); dl.textContent = 'Confirmar'; return; }
      const row = dl.closest('.row'); if (row) row.remove();
      return write(() => store.remove('timelogs', dl.dataset.dellog), 'Horas apagadas');
    }
    if (t.closest('[data-demo]')) return t.closest('[data-demo]').dataset.demo === 'on' ? seedDemo() : clearDemo();
    if (t.id === 'btn-del') {
      if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Clique de novo para excluir'; return; }
      const { kind, id } = modalCtx; closeModal();
      return write(() => store.remove(kind, id), 'Excluído');
    }
    if (t.classList.contains('overlay') || t.closest('button[data-close]')) return closeModal();
    if (t.closest('a') || t.closest('label')) return;
    const op = t.closest('[data-open]'); if (op) { const [k, id] = op.dataset.open.split(':'); return openForm(k, id); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modalCtx) return closeModal();
    if (e.key === 'Enter' && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'f-task-project') { state.taskProject = e.target.value; render(); }
    if (e.target.id === 'f-photo' && modalCtx) uploadPhoto(modalCtx.target, e.target.files && e.target.files[0]);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'f-search') runSearch(e.target.value);
    if (e.target.id === 'f-crm-search') { state.crmQuery = e.target.value; render(); }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'modal-form') submitForm(f);
    if (f.id === 'team-form') {
      const names = $('#f-team').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 12);
      if (!names.length) { toast('Informe pelo menos um nome.', true); return; }
      closeModal(); write(() => store.saveDoc('config/team', { members: names }), 'Equipe atualizada');
    }
    if (f.id === 'goals-form') {
      const num = n => { const v = f.elements[n].value.trim(); return v === '' ? null : Math.max(0, Number(v.replace(',', '.')) || 0); };
      const key = modalCtx.key; const prev = state.goals.find(x => x.id === key) || {};
      const body = { revenue: num('revenue'), deals: num('deals'), leads: num('leads'), revenueExtra: prev.revenueExtra ?? null, updatedAt: new Date().toISOString() };
      closeModal(); write(() => store.save('goals', key, body), 'Metas salvas');
    }
    if (f.id === 'note-form') {
      const inp = $('#f-note'); const text = inp.value.trim();
      if (!state.me) return openWho('Para deixar recados, escolha quem você é.');
      if (!text) return;
      inp.value = '';
      write(() => store.save('notes', uid(), { who: state.me, text: text.slice(0, 500), createdAt: new Date().toISOString() })).then(ok => { if (!ok) inp.value = text; });
    }
    if (f.id === 'search-form') { const r = $('#results .row'); if (r) { const [k, id] = r.dataset.open.split(':'); openForm(k, id); } }
  });

  // Arrastar e soltar
  let dragKey = null;
  document.addEventListener('dragstart', e => {
    const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return;
    dragKey = c.dataset.drag; c.classList.add('dragging');
    try { e.dataTransfer.setData('text/plain', dragKey); e.dataTransfer.effectAllowed = 'move'; } catch (er) {}
  });
  document.addEventListener('dragend', () => { document.querySelectorAll('.dragging,.over').forEach(el => el.classList.remove('dragging', 'over')); dragKey = null; });
  document.addEventListener('dragover', e => {
    const col = e.target.closest && e.target.closest('[data-drop]'); if (!col || !dragKey) return;
    if (col.dataset.drop.split(':')[0] !== dragKey.split(':')[0]) return;
    e.preventDefault();
    document.querySelectorAll('.over').forEach(el => el !== col && el.classList.remove('over'));
    col.classList.add('over');
  });
  document.addEventListener('drop', e => {
    const col = e.target.closest && e.target.closest('[data-drop]'); if (!col || !dragKey) return;
    e.preventDefault();
    const [kind, field, value] = col.dataset.drop.split(':'); const [k2, id] = dragKey.split(':');
    if (kind === k2) setField(kind, id, field, value);
  });

  // ---------- Início ----------
  render();
  store.init().then(() => {
    COLLS.forEach(c => store.watch(c, rows => { state[c] = rows; state.loaded[c] = true; render(); }));
    store.watchDoc('config/team', d => { if (d && Array.isArray(d.members) && d.members.length) state.team = d.members.map(String); render(); });
    store.watchDoc('config/look', d => { state.look = d; render(); });
    render();
  });
  // Atualiza a linha do "agora" e os minutos de quem está trabalhando
  setInterval(() => { if (!modalCtx && state.view === 'inicio') render(); }, 60000);
})();
</script>

</html>
